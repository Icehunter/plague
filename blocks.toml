# Material categories and voxel-light source selection.
# Water identity routes the dedicated water passes. lighting.voxel only selects placed light
# sources; it does not change a block's material, self-emission, or ability to block a light ray.
# Source colour and intensity still come from the intrinsic emission and labPBR texture data.

[lighting]
voxel = false # Unlisted blocks do not contribute to the voxel light field.

[categories.water]
blocks = ["minecraft:water"]

# Add/remove block IDs here, or declare another category with lighting.voxel = true.
# Current transport supports mapped full block faces. Opting in a torch or another unsupported
# shape does not supply its missing geometry; it cannot yet cast light through this path.
[categories.voxel_lamps]
blocks = [
    "minecraft:glowstone",
    "minecraft:sea_lantern",
    "minecraft:shroomlight",
    "minecraft:ochre_froglight",
    "minecraft:verdant_froglight",
    "minecraft:pearlescent_froglight",
    "minecraft:redstone_lamp",
]
lighting.voxel = true
