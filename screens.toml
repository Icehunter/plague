# Its own page rather than more rows on "Sky", because CLOUDS_VOLUMETRIC is an engine contract as
# well as a pack option: the engine reads that exact name to cancel vanilla's cloud pass
# (GraphRunner.packOwnsClouds), the same convention SKY_PROCEDURAL has on the Sky page. With it off
# vanilla draws its own clouds and every pass on this page is gated out of the graph entirely.
#
# DEFAULT OFF. A volumetric march is the most expensive per-pixel thing in the pack; this is opt-in.
[screens.clouds]
title = "Clouds"
elements = [
    "CLOUDS_VOLUMETRIC",
    "CLOUD_QUALITY|requires:CLOUDS_VOLUMETRIC",
    "u_CloudAltitude|requires:CLOUDS_VOLUMETRIC",
    "u_CloudAmount|requires:CLOUDS_VOLUMETRIC",
    "u_CloudScale|requires:CLOUDS_VOLUMETRIC",
    "u_CloudSpeed|requires:CLOUDS_VOLUMETRIC",
    "u_CloudSilverLining|requires:CLOUDS_VOLUMETRIC",
    "u_CloudShadowStrength|requires:CLOUDS_VOLUMETRIC",
    "u_CloudWeatherResponse|requires:CLOUDS_VOLUMETRIC",
    "CLOUD_SHADOWS|requires:CLOUDS_VOLUMETRIC",
]

# Its own page rather than rows on "Sky", and DEFAULT ON rather than opt-in -- the two go together.
# Fog here is not a weather effect that comes and goes; it is what makes the render-distance edge
# disappear, so the pack is wrong without it in a way it is not wrong without clouds or an aurora.
# The compile toggle exists to judge the effect against its own absence, not as a taste setting.
#
# Fog rows ONLY. This page once carried duplicates of the wave/snow/aurora/cloud/star rows that
# already live on their own pages; a control with two homes drifts in the user's memory and reads
# as two controls. Every option here is declared in shaders/include/fog_options.glsl, applies
# live, and its default is the fitted model's own value.
[screens.fog]
