# The air, and therefore every outdoor colour in the pack. Its own page ahead of "Sky" because it
# sits UNDER the sky rather than beside it: these six move what sunlight and moonlight ARE, which the
# sky, the fog, the clouds and every lit surface then inherit.
#
# All six are runtime, with no compile companions, and that is a property of the model rather than a
# convenience. Each one scales a density or a gain the integration already reads, so none of them
# changes how much work is done -- there is no quality tier hiding in here, and nothing to rebuild.
#
# Grouped air / light / dome, because that is the real split. The first three are weather and change
# how the atmosphere behaves. The next three are the eye and the exposure, and change how what comes
# out of it is read. The last four are the dome itself -- how the scattering is gathered into a sky.
# Turning "Air Density" up is a different KIND of act from turning "Sun Intensity" up.
[screens.atmosphere]
title = "Atmosphere"
elements = [
    "<group:Air>",
    "u_AirDensity",
    "u_AirTurbidity",
    "u_AirOzone",

    "<group:Light and Eye>",
    "u_SunIntensity",
    "u_MoonIntensity",
    "u_NightScotopic",

    "<group:Sunrise and Sunset>",
    "u_TwilightSpan",
    "u_SunsetBandWidth",
    "u_SunsetBandHeight",
    "u_SunsetSkyWarmth",
    "u_SunsetLightWarmth",
    "u_SunsetTemp",
    "u_AmbientSkyBleed",

    "<group:Dome>",
    "u_SkyGradient",
    "u_SkyBrightness",
    "u_SkyBiomeTint",

    "<group:Sun and Moon>",
    "u_SunDiscSize",
    "u_MoonDiscSize",
