# Plague settings UI.
#
# Three rules worth remembering when adding to this file, because all three fail quietly:
#
#  1. Declaring an option in a shader is not enough to make it appear. Nothing shows up unless it is
#     also listed on a screen here -- an option can be fully working and completely invisible.
#  2. A runtime option with a declared range still renders as a cycle button unless its name is in
#     the top-level `sliders` array below.
#  3. Every page a player can reach is listed under [yacl]. There is no second route into them.
#
# Note on u_BumpStrength / u_AOStrength: they are consumed by the TERRAIN shader, which receives no
# u_PackOptions block, so they are declared in a fullscreen shader instead. The engine reads those two
# names out of the pack options buffer and bridges them into terrain's u_PbrSettings UBO -- so the pack
# owns them and they appear here, even though the shader that uses them could never declare them.

