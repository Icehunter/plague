    "CLOUD_RESOLUTION",
    "u_CloudDetailFade",
    "u_CloudFadeSoftness",
    "<group:Cumulus|requires:CLOUDS_VOLUMETRIC>",
    "u_CloudTierCumulus",
    "u_CloudFadeCumulus",
    "u_CloudOpacityCumulus",
    "<group:Stratus|requires:CLOUDS_VOLUMETRIC>",
    "u_CloudTierStratus",
    "u_CloudFadeStratus",
    "u_CloudOpacityStratus",
    "<group:Stratocumulus|requires:CLOUDS_VOLUMETRIC>",
    "u_CloudTierStratocumulus",
    "u_CloudFadeStratocumulus",
    "u_CloudOpacityStratocumulus",
    "<group:Nimbostratus|requires:CLOUDS_VOLUMETRIC>",
