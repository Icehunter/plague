# Prose shown in each option's tooltip, above the mechanical Default/Range/Applies lines.
[descriptions]
PLAGUE_CLOUD_HISTORY_DEBUG = """
A test view for checking how well the clouds kept from earlier frames match freshly drawn \
clouds, in a small panel in the corner.

Candidates colours: green means a single layer matched, but does not by itself mean the old \
picture was kept; yellow means overlapping layers; magenta means moving high cirrus; blue means \
the picture was reset; red means the old picture was too old to use; cyan means the wrong layer \
or source; black means empty.

Error colours: red shows how far the colour is off, green shows how far the see-through amount \
is off, and blue shows how far the depth guess is off. Rejected pixels keep their Candidates \
colours. Darker candidate pixels are closer to the fresh clouds.

Move around, change the time of day or weather, and resize the window to compare the two. It \
briefly uses more memory and work while on, and its panel can show up in reflections or in the \
effect that blends frames together for smoother motion. Off removes it. Neither view skips any \
cloud pixels."""

PLAGUE_VOXEL_REFLECTIONS = """
Lets the game find water reflections from nearby world shapes, including things off screen.

Needs Water Surface set to Reflective and Reflections set to High or Epic. Light Reach \
(Chunks) and how much of the world is loaded around you limit how much it can find, and small \
shapes or lighting can look a little different from the real scene. Works above water, on both \
still water and waves."""
PLAGUE_VOXEL_PROFILE = """
A test view for measuring how much World Reflections costs, without changing what you see.

It runs five extra timed passes and writes them to the F10 log: the main reflection trace \
(including see-through parts), reading the material, direct light, reflected rays without fog, \
and one full repeat. It runs slower while on. Hold your view still until the numbers settle, \
save the log, then turn it Off. The full pass minus the no-fog pass is roughly what fog costs; \
the no-fog pass minus the direct-light pass is roughly what extra bounced reflections cost. \
These are rough differences, not exact costs during normal play.

Needs World Reflections on, and reflective water with Reflections set to High or Epic."""
PLAGUE_LOCAL_LIGHTING = """
Experimental block-by-block lighting, separate from Minecraft's normal light.

Turns off Minecraft's normal block light on every surface, even ones it doesn't fully support \
and where its block data is missing. Sunlight, skylight, the light from items you hold, and \
glowing blocks still work as normal.

Only blocks the pack has specifically set up as light sources work with this. A full, solid \
block face can light nearby solid cube faces up to four blocks away. Shapes it doesn't support, \
places with many light sources close together, and distant terrain can stay dark.

It only remembers lighting in a small area around you, and checks shadows at a coarse, \
half-block scale; both are known rough edges. This is direct light only: it does not bounce off \
surfaces to light up other surfaces."""
PLAGUE_LOCAL_EMITTER_SIZE = """
The size of the glowing area each light source appears to shine from.

Quarter block is the smallest, and gives the sharpest shadows from thin blocks such as a fence \
post or a hopper. Full face spreads the light across the whole face for the softest result. All \
three give off the same total amount of light; only how spread out it looks changes."""
PLAGUE_SOURCE_DIAGNOSTIC = """
A test view for checking which blocks the pack can read as light sources. It is not coloured \
light or a reflection preview. It reads terrain depth, including terrain hidden behind water.

Sources: red is a light source; green is a glowing material the pack supports; yellow is both; \
grey is no known source. Purple stripes mean a material or shape the pack can't read; solid \
purple means its data is old or missing.

Freshness: green means the area has data; cyan means the area is empty but up to date.

Both of these views: solid red means the area isn't ready yet or is being reused; amber means \
it's outside the Light Reach (Chunks) range; white means data is missing or doesn't match.

Face Colours shows a corner panel of up to 4096 accepted block faces, each with a 4-by-4 grid \
of colour samples taken from its texture. It adds no light to the scene. Black is a normal, \
non-glowing sample or a see-through gap; grey is an unused slot; magenta is rejected or old \
data. These samples are sparse and can miss tiny glowing spots. The list includes hidden faces \
and is not a complete or nearest-first list of sources.

The F10 log records source counts, faces still waiting to be processed, and upload work; those \
waiting faces are not shown in the panel. Animated, cropped, layered, and other unsupported \
textures stay unknown. Off removes the overlay; World Reflections still builds its own grid \
without it."""
PLAGUE_SOURCE_RADIANCE = """
A preview of the glow colour of the solid and see-through blocks you can see. It does not light \
up nearby surfaces.

Source Colour works out this glow from the block's texture and biome colour, its own built-in \
glow, and any glow the pack has given its material, without normal shading or block exceptions. \
Compare Glow shows the game's usual glow rule on the left and this material-based glow on the \
right.

Black means no glow, sky, or a surface this preview doesn't cover. Terrain behind water still \
counts as terrain, but water, glass and the item in your hand can still draw over the preview. \
Both sides use the same fixed brightness, without Auto Exposure, Bloom or Tonemap \
applied.

This view overrides other test views. Turn it Off to see normal lighting again."""
PLAGUE_GI = """
Light that bounces: one ray per cell of a coarse grid, leaving each surface you can see and \
carrying back what it finds.

A second ray asks whether the sun reaches where the first one landed, so a surface in shade sends \
back nothing. Glowing blocks send light whatever the sun does, which is what lights a room.

This takes over from the game's own block light rather than adding to it. That light is a flood \
fill: it fills a room evenly whatever stands in the way. This light has to get past the walls."""

u_GiLightStrength = """
How strong glowing blocks are in the bounce light.

One lights a room at 1. Raise it for a brighter, more open look, lower it for a darker one."""

PLAGUE_LOCAL_DEBUG = """
Shows one half of Coloured Lighting on its own.

Visibility only is how much of each glowing block reaches a surface, as grey. Light only is the \
brightness with nothing in the way. Everything else multiplies the two together, so a test view is \
the only way to tell which of them carries a fault."""

PLAGUE_GI_VIEW = """
Paints the bounce light over the screen on its own, without the rest of the frame.

Useful for seeing what the rays actually found. Grainy, because one ray per cell is what a first \
bounce costs."""

PLAGUE_VOXEL_COVERAGE = """
A test view painted onto water, showing what the World Reflections grid can see. It is not a \
reflection.

Green means it hit a solid block. Magenta means a cutout or cross-shaped block, with its \
see-through parts not checked. Amber means the water sits outside the grid. Red means that part \
of the world isn't in the grid yet. Cyan means the way is clear all the way to the edge of the \
grid, though that doesn't prove there's open sky above. White means the stored data is missing \
or doesn't match.

Behind Cutouts skips whole cutout blocks, to show whether solid ground stands behind them.

Telling truly empty space apart from not-yet-loaded space depends on the game keeping track of \
the world correctly. Off removes both test passes. World Reflections asks for the grid on its \
own either way."""

u_LightReach = """
How far the block grid used for World Reflections and Test View: Reflection Coverage reaches \
around you, in chunks.

Set from 1 to 16, one chunk at a time. Higher values cover more terrain, but use more memory \
and take more time. The game may cap this at your render distance or at its own limit. Blocks \
outside this range can't be reflected."""


OUTLINE_ENABLED = """
Draws lines along the edges of blocks and other shapes in the world.

It draws where surfaces fold, or where one thing stands in front of another, so a block corner \
and a rooftop against the sky both get a line. A flat wall of a hundred blocks gets one outline \
around the wall, not a grid. Water, glass and the item in your hand are never outlined, and \
nothing under water is. Lines follow the surface's lighting and colour and disappear with it in \
darkness. Costs a small amount of extra work for every pixel on screen."""

u_OutlineConvex = """
Strength of outside edges: corners pointing toward you, and anything standing out against \
what's behind it.

Draws rooflines, ridges and the near side of a doorway. Below 0 it darkens those edges instead \
of brightening them, so this one slider gives you ink lines or chalk ones."""

u_OutlineConcave = """
Strength of inside corners: a floor meeting a wall, the back of an alcove.

Below 0 it darkens them instead, which is closer to how light behaves there. Ambient Occlusion \
already shades these corners, so a value above 0 works against it. It starts at 0."""

u_OutlineThickness = """
Line width, in pixels.

It only widens. What counts as an edge is decided by the angle a surface turns through, so \
raising this does not sweep more of the world into the effect. A band this many pixels wide at \
the very edge of the screen draws no lines."""

u_OutlineDistance = """
How far out, in chunks, lines are drawn. They fade over the last quarter of it.

This decides whether natural ground reads as outlined shapes or as a wire mesh. A line's \
brightness does not change with distance, but the number of lines does: a far pixel covers many \
blocks, and every step between two of them is a real edge. Lower it until the hills look like \
hills. It also makes the effect cheaper, since nothing past the fade is worked out."""

OUTLINE_FOLIAGE = """
Whether leaves, grass and fences are outlined.

They are cutout textures, so every gap between leaves is a real edge and a tree comes out as a \
mass of lines rather than a shape with an outline. Distant canopy turns into a haze that crawls \
as you move. Skip is the better choice."""




u_SkyBrightness = """
Brightness of the sky fill used for ambient lighting, lighting on water, reflected clouds, and \
fog around see-through particles and banners.

This changes brightness only; the sky fill keeps its same colour. The sky you actually see in \
the background has its own separate lighting."""

u_SkyBiomeTint = """
How much the biome's sky colour tints the ambient sky fill, lighting on water, reflected \
clouds, and fog around see-through particles and banners.

At 0 the fill ignores the biome's colour. Higher values shift its hue while keeping its \
brightness the same."""

u_SunsetSkyWarmth = """
How orange the sunset sky gets.

It only touches the warm band on the sun's side of the sky, and only around sunrise and sunset. \
At midday and midnight it does nothing. The slider below sets the exact shade of orange."""

u_SunsetLightWarmth = """
The same warmth, applied to the light instead of the sky: the sunlight, and the glow it bounces \
off the world.

A sky can be orange while the ground is still lit plainly; this is what warms the light itself. \
It changes colour only, not brightness."""

u_SunsetTemp = """
What "warm" means for the two sliders above, in kelvin.

Low is a deep ember red, around 2000 K is a low sun through thick air, and high is barely warm \
at all. The sky and the light share this value, so they always warm toward the same colour."""

u_AmbientSkyBleed = """
Whether the ambient light on the world uses the whole sky's colour, or just the colour straight \
overhead.

At 1, surfaces are lit by everything above them, so a sunset casts a warm glow across the \
world. At 0, only the sky directly overhead counts, and sunsets stop colouring the ground."""

u_SunDiscSize = """
The sun's size in the sky, as an angle, in radians.

The real sun is 0.005 and covers a handful of pixels. Regular Minecraft's is 0.29, wide enough \
to swallow its own glow, so the glow around it only shows below about 0.12."""

u_MoonRelief = """
How pronounced the moon's craters are.

The relief is baked at three times true scale, which is 1 here. It shows most along the line \
between the moon's light and dark sides, where the light grazes the surface."""

u_MoonLibration = """
How far the moon's face rocks between nights, in degrees.

The real moon keeps one face turned toward us, but its orbit tilts and its speed varies, so \
about 8 degrees of each edge swings into view and back. 0 pins the face still."""

u_MoonDiscSize = """
The moon's size in the sky, as an angle, in radians.

The real moon is 0.0045, within a few percent of the sun's, which is why eclipses work. Regular \
Minecraft's is 0.20."""

u_SunDiscBrightness = """
How much brighter the sun's disc is than the light it casts.

The disc keeps pace with the sunlight, so it still reddens and dims through a sunset. 0 removes \
the disc and leaves only its glow."""

u_MoonDiscBrightness = """
The same, for the moon.

Dimmer than the sun's by default, so the stars and Night Nebula still show against the night \
sky."""

u_TwilightSpan = """
How long the added sunrise and sunset warmth lasts.

Higher spreads the warmth and the sky's colour change across more time. The sun's movement and \
the sky's own lighting still follow the game clock."""

u_SkyGradient = """
How quickly the ambient sky colour changes between overhead and the horizon.

Low spreads the horizon's colour through more of the sky. High keeps it close to the horizon. \
This also affects lighting on water, reflected clouds, and fog around see-through particles and \
banners."""

u_SunsetBandWidth = """
How far around the horizon the warm sunset colour reaches.

Low wraps the warmth almost all the way around you. High keeps it in a narrow wedge on the \
sun's side and leaves the opposite horizon cool, the way a real sunset does."""

u_SunsetBandHeight = """
How high up the sky the sunset colour climbs.

Higher keeps the warmth in a thin strip along the horizon. Lower lets it climb toward the top \
of the sky, which is most of what makes a sunset feel like one."""

u_SunGlowStrength = """
Strength of the sunward glow in fog around see-through particles and banners, near the edge of \
your render distance.

0 removes this fog glow. The halo you see around the sun in the sky comes from the sky itself, \
not from this effect."""

u_SunGlowTightness = """
Spread of the sunward glow in fog around see-through particles and banners.

High concentrates it around the sun's direction; low spreads it across more of the horizon."""

u_MoonGlowStrength = """
Strength of the moonward glow in fog around see-through particles and banners, near the edge of \
your render distance.

0 removes this fog glow. The halo you see around the moon in the sky comes from the sky itself, \
not from this effect."""

u_MoonGlowTightness = """
Spread of the moonward glow in fog around see-through particles and banners.

High concentrates it around the moon's direction; low spreads it across more of the horizon."""

u_AirDensity = """
How thick the air is. This is the main sunset control.

More air deepens the blue overhead and makes the low sun redder and richer. Less air fades the \
whole sky toward a pale, washed-out look."""

u_AirTurbidity = """
How much dust and haze the air carries.

Higher greys out distant terrain and pulls the horizon in, like a smoky or dusty day. 0 is air \
with no haze at all, clearer than any real day."""

u_AirOzone = """
How deep blue the sky stays after the sun goes down.

It barely touches daylight. Twilight is where it shows. At 0 the evening sky fades to grey \
instead of deep blue."""

u_SunIntensity = """
How bright sunlight is overall.

Brightness only. The colour of the light does not change."""

u_MoonIntensity = """
How bright moonlight is overall.

Real moonlight would be far too dark to play in, so this lifts it to where you can see."""

u_NightScotopic = """
How blue and washed-out the night looks, the way human eyes see in the dark.

At night your eyes shift toward blue and lose colour, which is why moonlight looks cool. 1.0 is \
fully night-adjusted eyes; 0.0 shows the night as a camera would, slightly warm."""


PLAGUE_SHORE_DEBUG = """
A test view for checking why Shoreline Spill does or does not appear, painted as flat colours.

Black means this spot was never checked. Red means there's no ground data here. Blue is water. \
Orange is ground with no water next to it. Yellow is ground next to water, where the waves stay \
below the top of the block. Green is ground the water is washing over. Leave this Off for \
normal play."""

PLAGUE_SHORE_SPILL = """
Water washing over the ground it reaches, and drying out again.

Where a wave crest clears the top of a block beside the water, that block goes wet and \
reflective, then dries from the edges in over the next minute. Needs Water Simulation \
Boundaries on: without them nothing knows where the water ends."""

PLAGUE_WATER_INTERACTION = """
Waves and wakes made by you and by boats.

They spread out from you and linger on the water as you move. Epic looks sharper and \
smoother; High is cheaper on your frame rate and a little coarser. No extra mods needed."""

SURFACE_FLUID_DETAIL = """
Stops your waves from crossing onto land or leaking into separate pools of water.

High is the default. Epic follows the water's edges more carefully, at a higher cost \
to your frame rate; Off lets waves pass straight through shorelines."""

PLAGUE_WATER_MESH_DISPLACEMENT = """
Lets waves actually raise and lower the water's surface, instead of only changing how the light \
on it looks.

Standard is the default. Off keeps the water flat like it is in regular Minecraft, with waves \
only showing up in the lighting."""

WATER_VEIL = """
The haze that builds up between you and whatever you're looking at, underwater.

The underwater fog sliders drive this effect and do nothing while it's off. It's separate from \
Underwater Tint: that tints everything at any distance, while this haze only thickens the \
farther away things are."""

WATER_ABSORPTION_TINT = """
The colour water gives everything you see through it, even close up.

It tints and darkens your whole view while you're underwater, no matter how far away things \
are. The Water Tint Red, Green and Blue sliders set the colour."""



WATER_SUN_TINT = """
Turns sunlight blue-green once it has passed through water.

Water soaks up red light first, so the light reaching the seabed is already blue-green. Turn \
this off and underwater surfaces are lit by plain, unfiltered sunlight."""

WATER_AMBIENT_FLOOR = """
Keeps a small amount of light on underwater surfaces, coloured like the water around them.

Turn this off and anything in shadow underwater goes completely black, and even holding a \
lantern barely lights it up."""

WATER_HELD_LIGHT_FILTER = """
