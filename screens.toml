# Its own page rather than rows on "Sky", and DEFAULT ON rather than opt-in -- the two go together.
# Fog here is not a weather effect that comes and goes; it is what makes the render-distance edge
# disappear, so the pack is wrong without it in a way it is not wrong without clouds or an aurora.
# The compile toggle exists to judge the effect against its own absence, not as a taste setting.
#
# Fog rows ONLY. This page once carried duplicates of the wave/snow/aurora/cloud/star rows that
# already live on their own pages; a control with two homes drifts in the user's memory and reads
# as two controls. Fog controls are declared in fog_options.glsl. Local Mist Amount only affects the
# compute step, so it lives in atmo_mist.glsl instead, to avoid changing the uniform layout that
# geometry passes read. Each control applies
# live, and its default is the fitted model's own value.
[screens.fog]
title = "Fog"
elements = [
    "PLAGUE_FOG",
    "<group:Fog Features>",
    "u_FogEnableDistance",
