    "u_CloudFadeNimbostratus",
    "u_CloudOpacityNimbostratus",
    "<group:Altocumulus|requires:CLOUDS_VOLUMETRIC>",
    "u_CloudTierAltocumulus",
    "u_CloudFadeAltocumulus",
    "u_CloudOpacityAltocumulus",
    "<group:Cirrocumulus|requires:CLOUDS_VOLUMETRIC>",
