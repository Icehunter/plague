How strongly raindrops ripple across puddles.

Rings spread out from each drop and fade, and only while rain is actually falling. When the sky \
clears, the drops stop landing while the puddles themselves linger and dry. Past Heavy, the \
surface stops looking like rained-on water and starts looking like frosted glass."""

u_WaterClarity = """
How far you can see into the water.

Raising it makes deep water look like shallow water. Red light fades out first, which is why \
deep water turns blue-green before it goes dark."""

u_WaterReflectionStrength = """
Strength of reflections on water only.

Kept separate from the main Reflection Strength setting, so tuning lake reflections cannot \
change how metal looks."""

u_WaterSplashStrength = """
How strongly the view warps when the camera crosses the water surface, going in or out.

Zero turns the crossing effect off without touching the underwater look itself. This is \
separate from Underwater Distortion, which is the shimmer you see while already underwater, \
not the moment of crossing."""

u_WaterSunGlitterStrength = """
Strength of the sun's sparkle on the water surface.

It follows the waves, the sun's actual position and the weather. Zero removes just the \
sparkle; reflections are untouched."""

u_UnderwaterSunGlitterStrength = """
Strength of the sunlight glinting through the surface when seen from below.

Zero removes the glint and changes nothing else about the underwater view."""

u_UnderwaterDiscSoftness = """
How soft and hazy the sun or moon looks from underwater.

Low keeps a crisp shape, high blurs it into a glow, and deeper water is always hazier than the \
surface, so this sets the ceiling. The wobble is the water itself and never changes; if the sun \
or moon shimmers, raise this."""

u_UnderwaterWarpBends = """
How many broad ripples fit across the height of your screen when the view bends underwater.

Low gives one slow lean across the whole view; high breaks the bending into smaller ripples. \
This is based on your screen, not on blocks, so walking toward a wall does not change what the \
number means."""

u_UnderwaterViewWarpPixels = """
A slow, gentle sway of your whole view while underwater.

The number sets how far, in pixels, your view can drift to one side; the picture is drawn a \
little larger than the screen so the edges never show a gap. Straight edges bend near and far \
alike, and the whole finished view, including light shafts, blur and glow, moves together. This \
is different from Underwater Distortion, which is a finer shimmer that stays anchored to the world."""

CLOUD_SHADOWS = """
Clouds cast moving shadows on the ground.

Without it, a cloud can darken the sky yet leave the ground beneath it in full sun; the \
shadows match the actual clouds overhead. Needs Volumetric Clouds to be on."""

WATER_FOAM = """
Foam along shorelines.

It follows shallow water, so it hugs every coast, sandbar and river mouth on its own. Open water \
never grows foam. Only the shorelines do."""

u_WaterFoamAmount = """
How much foam appears at shorelines.

Zero removes it entirely, which is handy for telling whether something odd at a shoreline is the \
foam or the water underneath it."""

u_FoamTextureScale = """
How large the foam pattern is on the water.

Higher shrinks the pattern and repeats it more often; lower stretches it larger. It does not \
change how much foam there is. That is Foam Amount."""

u_FoamPomDepth = """
How much real thickness the foam appears to have, in blocks.

It uses the bumps built into the foam pattern to shift with your view angle, instead of lying \
flat like a sticker. Zero turns it off and skips its cost entirely."""

SSR_WATER_MODE = """
What the water surface is.

Vanilla draws it the way the game does by default: a flat textured plane, no waves. Shaded switches \
to this pack's surface, with animated waves, foam, light ripples, a sun track and the sky \
reflected in it. Reflective adds a reflection of everything else on screen on top, so the shore \
and anything else visible appears in the water as well as the sky.

Reflective needs Reflections on; without it, it renders as Shaded."""

u_WaveStrength = """
How rough the open water is.

Zero is a calm mirror apart from the waves you make yourself; one is a normal working sea, and two \
is a rough one, with longer swells and higher crests. Waves never grow foam at any setting. Foam \
belongs to shorelines."""

u_WaveSpeed = """
How fast the waves move.

Zero freezes them, one is normal speed, four is four times as fast. Underwater light shafts run \
on the same clock, so the light stays attached to the wave that made it."""

u_WaterShaftDistance = """
How far away underwater light shafts are still drawn, in chunks.

They stay at full strength through most of the range, then fade smoothly to nothing. Fog, tint \
and the rest of the underwater view are unaffected."""

u_WaterShaftStrength = """
How bright the underwater light shafts are.

Zero removes the shafts and nothing else; one is the natural level, and three triples it."""

u_WaterShaftFocus = """
Contrast of the underwater light pattern.

Zero flattens it into an even glow; one is the natural look; two makes the bright bands brighter \
and the gaps between them dimmer."""

u_WaterShaftSpread = """
How visible the light shafts stay as you look away from the sun or moon.

Zero keeps them strongest when looking toward the light; one spreads them evenly in every \
direction. It changes direction, not overall brightness."""

u_WaterShaftPersistence = """
How much the light shafts are smoothed over time.

Higher is calmer and less shimmery, but smears fast-moving light into softer bands. Lower it if \
you speed up world time or Wave Speed; 0.70 matches the original look."""

u_WaterTurbidityDepth = """
How much murkier the water gets the deeper you go. Silt settles toward the bottom, so a shaft that \
stays crisp near the surface turns dense and short further down.

Zero holds the whole column at whatever Water Clarity is set to. Higher leaves the top few metres \
alone and thickens the water below them, so a deep ocean shows it and a shallow pond barely does. \
This makes the light spread and soften as it goes down, rather than the view going dark. \
Light shafts only; the underwater fog and darkness sliders are unaffected."""
u_WaterMoteAmount = """
Specks of drifting matter suspended in the water, the sort that catches a torch beam in a flooded \
cave. They sit at fixed points in the world and sink slowly, so they slide past you as you swim \
rather than sticking to the screen.

Each speck lights up from whatever light is reaching that spot, so they flare as they cross a sun \
shaft and dim again in shadow. Water Murkiness By Depth above is a different thing entirely: that \
thickens the water itself, this puts things in it.

Set it to 0.00 for perfectly clean water. Above about 1.50 the field starts to read as busy \
rather than suspended.
"""

SSR_QUALITY = """
Reflections: smooth and wet surfaces mirror the world around them.

They can only mirror what is on screen, so things behind you or past the screen's edge fade out \
of a reflection rather than being guessed at. This is also what makes rain look wet rather than \
merely dark."""

u_SsrStrength = """
How strongly reflections show on a surface.

Raising it makes surfaces more mirror-like, not brighter. A reflection replaces part of the \
surface rather than adding light on top of it."""

u_SsrMaxDistance = """
How far away a reflection can reach, in blocks.

Longer finds more distant reflections but spreads the same effort thinner, so raise Reflection \
Detail along with it."""

u_SsrTraceQuality = """
Quality of the reflections.

Too low, and distant reflections cut off early. The cost is only paid on surfaces smooth or wet \
enough to reflect at all."""

u_EndOutline = """
How much of the world outline is kept in the End.

Lines follow the surface's lighting here too. This scales their strength separately for the End. \
Zero turns them off there and leaves every other place alone."""

u_EndAmbient = """
How strong the fill light is in the End.

The End has no sun, so this is the only thing lighting a surface that faces away from everything. \
Its colour comes from the sky itself, averaged over every direction, including below you: there is \
no ground in the End, so an island is lit from underneath as well."""

u_EndSkyBrightness = """
How much light the End gives off.

The End has no sun. What you see is the air itself giving off light, so this sets how bright the \
whole place is. Zero leaves it black."""

u_EndAirReach = """
How far you can see in the End, as a share of how far the game is drawing.

A share and not a set number of chunks, so it holds up whatever your view distance is. Fog set \
in blocks leaves islands sharp right up to the point the game stops drawing them, and they blink \
out. Lower closes the place in around you; higher lets you pick out the far islands."""

u_EndNebulaIntensity = """
How strong the End's clouds of light are. Zero turns them off."""

u_EndNebulaAmount = """
How much of the End's sky the clouds cover.

Higher grows them outward from their bright centres rather than adding new ones."""

u_EndNebulaZoom = """
How big the End's clouds are. Higher makes smaller, busier shapes."""

u_EndNebulaDrift = """
How fast the End's clouds move. Zero holds them still."""

u_EndNebulaCoreOnset = """
How thick a cloud has to get before its centre turns violet.

Thin edges keep the red of hydrogen; the dense middles burn the violet lines instead."""

u_EndNebulaCoreWidth = """
How gradually a cloud changes from its red edge to its violet centre."""

u_EndNebulaStarGlow = """
How much the stars behind the End's clouds glow through them."""

u_EndStormIntensity = """
How strong the sheets of light tearing through the End are. Zero turns them off.

They are walls of light moving through the same gas the sky is made of, seen from the side, which \
is why they read as curtains rather than as clouds."""

u_EndStormSize = """
How big the sheets are. Lower makes fewer, wider ones."""

u_EndStormSurge = """
How hard the storm swells and dies as it passes over.

Zero holds the sheets at one strength. Higher makes fronts roll through, bright then gone."""

u_EndStormReach = """
How far up the sky the sheets climb. Lower keeps them near eye level."""

u_EndMoteAmount = """
Specks of light drifting close to you in the End.

They sit close to you rather than off in the sky, so they slide past the far view as you move. \
A speck crossing something bright catches its light. Zero turns them off."""

u_EndMoteDrift = """
How fast the specks drift. Zero holds them still in the world."""

u_EndMoteSize = """
How big each speck is drawn.

It only makes them bigger. They start at the smallest size that stays still: any smaller and a \
speck would be thinner than a pixel and flicker as you turn."""

u_EndOuterReach = """
How far out the middle island ends and the outer ones begin, in chunks.

64 is where the game itself splits them. Past this point the sky dims and the storm falls behind \
you, so this is what makes flying out feel like going somewhere."""

u_EndOuterDim = """
How much darker the sky is out among the outer islands. Zero makes both halves look the same."""

u_EndOuterStormFade = """
How much more the storm fades out among the outer islands, on top of the dimming above.

At 1.0 the storm belongs to the middle island alone."""

u_EndTurn = """
How fast the whole cloud creeps around you. 1.0 is one full circle in about eight minutes.

The stars do not turn with it, so the two slowly pull apart. Zero holds it still."""

u_EndBreath = """
How much the whole place swells and falls, on about a forty second cycle. Zero holds it steady."""

u_HeatShimmer = """
How much the air wobbles and ripples wherever heat is present.

Shared by both sources below. Zero turns it off."""

u_HeatShimmerEmissive = """
Wobble over lava, fire, campfires and anything else that glows.

Finds them by their own glow, so nothing needs listing by name."""

u_HeatShimmerNether = """
A baseline heat haze that plays everywhere in the Nether, not just over glowing surfaces."""

u_NetherHeatAmbient = """
How strong the Nether's baseline heat haze is, on its own dial from the wobble above."""

u_NetherHeatDistance = """
How close the Nether's baseline haze reaches. Lower brings it nearer to you."""

u_NetherHeatBlurStrength = """
Blurs distant air in the Nether into a soft haze, like the blur you see looking through deep \
water.

Zero turns it off. Higher makes the haze stronger."""

u_NetherHeatBlurStart = """
How close the Nether haze starts. Lower brings the haze nearer to you; higher pushes it further \
away."""

SSAO_ENABLED = """
Soft shading in corners, creases and where things meet the ground.

It comes from the shape of the world itself: where a block meets the floor, inside an alcove, \
under a plant. It works alongside Corner Shading Strength below, which is the fine shading \
painted into your resource pack's textures; the two stack together."""

SSAO_TAPS = """
Quality of the corner shading.

Higher looks smoother; lower can show up as fine speckling on busy scenes. The frame rate cost \
rises roughly along with the setting."""

u_SsaoRadius = """
How far, in blocks, the corner shading spreads out from where surfaces meet.

A small setting only catches the tight shadow right where two surfaces touch. A large setting \
darkens whole alcoves and rooms, but costs more and can shade across gaps that are not really \
touching."""

u_AOStrength = """
Strength of the fine shading painted into your resource pack's textures: mortar between bricks, \
the weave of wool, dents in metal.

This pairs with Ambient Occlusion above: this option gives surfaces their fine texture, while that \
one grounds objects into the scene around them. Does nothing on resource packs without normal-map \
textures."""

u_AuthoredEmission = """
How strongly the glow painted into textures shines, mostly the glint on ores.

Ores give off no real light of their own, so this decides whether a vein of copper glitters or \
reads as plain grey stone. Glowstone, lanterns and lava are untouched, since they already give off \
real light. Set it to 0 to turn the painted glow off completely."""

u_BumpStrength = """
How strongly light picks out the bumps in textures: brick edges, wood grain, stone pitting.

At 0 every surface is lit as if it were perfectly flat. Needs a resource pack with normal maps to \
do anything."""

u_SsaoStrength = """
How dark the corner shading gets.

It only darkens soft background light, not direct sun or fire, so a crevice in full sunlight \
stays bright. That is why it shows up most at night, indoors and in shade."""

# --- Light colour multipliers (Lighting screen) -------------------------------------------------
# Four time-of-day slots, each with a red/green/blue channel and an intensity. All default to 1.00,
# which is exact identity -- the sliders do nothing until moved.

u_LightMorningR = """
Tints the sunlight red at dawn and dusk.

Above 1.00 the low sun throws a redder light across the world; below 1.00 it drains the red out \
and dawn and dusk turn cold. Changes the light only, not the sky above it."""

u_LightMorningG = """
Tints the sunlight green at dawn and dusk.

Green sits in the middle of the three colours, so moving it alone shifts the light between \
pinkish magenta below 1.00 and a yellow-green cast above it."""

u_LightMorningB = """
Tints the sunlight blue at dawn and dusk.

Lowering it deepens the warm orange a sunrise already has; raising it cools dawn toward the flat \
blue-white light of midday."""

u_LightMorningI = """
How bright dawn and dusk sunlight is, without changing its colour.

Scales the red, green and blue sliders above together, so the shade of the light stays the same \
and only its strength changes."""

u_LightNoonR = """
Tints the midday sunlight red.

Midday light is the brightest the world gets, so even a small move here shows across the whole \
scene, not just on faces facing the sun."""

u_LightNoonG = """
Tints the midday sunlight green.

Below 1.00 noon takes on a magenta cast; above it, a slightly sickly yellow-green. Small moves are \
usually all you need."""

u_LightNoonB = """
Tints the midday sunlight blue.

Raising it gives a cold, overcast look at noon; lowering it warms midday toward the feel of late \
afternoon, without changing the actual time of day."""

u_LightNoonI = """
How bright midday sunlight is, without changing its colour.

The single strongest control over how bright the world looks. Auto Exposure will claw back part \
of a large change, so move this one in small steps."""

u_LightNightR = """
Tints the moonlight red.

Night light is dim, so this mostly changes the feel of shadowed ground rather than any bright \
surface."""

u_LightNightG = """
Tints the moonlight green.

Above 1.00 gives night air a faint sickly cast; below 1.00, a soft mauve one."""

u_LightNightB = """
Tints the moonlight blue.

Moonlight is already the coolest light in the pack. Raising this makes nights look colder and \
more silver; lowering it makes them look grey."""

u_LightNightI = """
How bright moonlight is, without changing its colour.

This slider opens all the way down to 0.01, because a truly dark night is a look many players \
want, while every other light slider only goes down to half."""

u_LightRainR = """
Tints the sunlight red while it is raining.

Rain light is already grey and flat, so this decides whether a storm feels warm and muggy or cold \
and bleak."""

u_LightRainG = """
Tints the sunlight green while it is raining.

Even a small increase gives the green-grey look of a summer storm."""

u_LightRainB = """
Tints the sunlight blue while it is raining.

Raising it pushes rain toward a cold blue-grey; lowering it pushes it toward a brown, dusty \
storm."""

u_LightRainI = """
How bright the light is while it is raining, without changing its colour.

Rain already darkens the world; this decides by how much."""

# --- Atmosphere colour multipliers (Fog screen, Sky Color Tuning) --------------------------------
# The same four time-of-day slots, applied to the SKY: the dome itself, the aerial haze and edge
# fog terrain fades into, the cloud deck's own fade-to-sky, and sky reflections. NOT the ambient
# light that fills shadow and indoor space; that is Ambient Noon/Night/Rain R/G/B on the Lighting
# screen (CUSTOM_LIGHT_COLORS). Raising one of these sliders moves the whole sky and everything
# that fades into or reflects it together, so the horizon never disagrees with the haze in front
# of it.

u_AtmMorningR = """
Tints the sky and haze red at dawn.

Moves the sky dome, the haze that distant land fades into, the edge of your view distance, where \
clouds fade into the sky, and sky reflections, all together."""

u_AtmMorningG = """
Tints the sky and haze green at dawn."""

u_AtmMorningB = """
Tints the sky and haze blue at dawn.

A dawn sky already leans blue on its own; lower this slider to fight that, or raise it to lean \
into it."""

u_AtmMorningI = """
How bright the sky and haze are at dawn, without changing their colour."""

u_AtmNoonR = """
Tints the sky and haze red at midday.

Moves the sky dome, the haze that distant land fades into, the edge of your view distance, where \
clouds fade into the sky, and sky reflections, all together."""

u_AtmNoonG = """
Tints the sky and haze green at midday.

Useful for balancing things out if the sky looks too pink or magenta."""

u_AtmNoonB = """
Tints the sky and haze blue at midday.

The most direct control over how blue the sky and distant haze look at noon."""

u_AtmNoonI = """
How bright the sky and haze are at midday, without changing their colour."""

u_AtmNightR = """
Tints the sky and haze red at night."""

u_AtmNightG = """
Tints the sky and haze green at night."""

u_AtmNightB = """
Tints the sky and haze blue at night.

Raising it gives the classic silver-blue night sky; lowering it makes the night look closer to \
plain black."""

u_AtmNightI = """
How bright the sky and haze are at night, without changing their colour."""

u_AtmRainR = """
Tints the sky and haze red while it is raining."""

u_AtmRainG = """
Tints the sky and haze green while it is raining."""

u_AtmRainB = """
Tints the sky and haze blue while it is raining.

The main control over whether an overcast sky looks cold or warm."""

u_AtmRainI = """
How bright the sky and haze are while it is raining, without changing their colour."""

# --- Water screen -------------------------------------------------------------------------------
# Every distance and depth slider on this page is measured in CHUNKS (16 blocks), the way a player
# reads distance in game.

PLAGUE_UNDERWATER = """
The master switch for everything that happens once your view goes under water.

Off leaves plain vanilla water: no fog underwater, no Underwater Caustics on the sea floor, \
no blur, no distortion of your view. Every other option on this page stops doing anything."""

WATER_SCATTERING_QUALITY = """
Whether sunlight casts visible shafts of light down through the water, and how carefully they are \
drawn.

Off skips this entirely and costs nothing. High draws it more cheaply; Epic takes more steps, so \
the shafts keep their shape at a distance instead of breaking into bands."""

u_WaterTintSaturation = """
How coloured the water looks when you view it from above the surface.

At 0 the surface looks like plain grey glass with a reflection on it; higher lets the water's own \
blue-green colour show through. It does not change what you see once you go under the surface."""

u_DepthDarkness = """
How dark the water looks as it gets deeper, seen from above the surface.

This is the extra shading on the water's surface that tells you "there is a lot of water under \
this". At 0 a deep ocean looks just as light as a puddle."""

u_WaterTintR = """
How much red is mixed into the water's own colour.

These three sliders (red, green and blue) set the colour that light takes on as it passes through \
the water. Raising red turns a lake toward tea-coloured swamp water."""

u_WaterTintG = """
How much green is mixed into the water's own colour.

High green with low red gives the look of tropical shallows; dropping green moves the water \
toward deep-ocean blue."""

u_WaterTintB = """
How much blue is mixed into the water's own colour.

This is the highest of the three by default, because real water soaks up red light first and blue \
light last. That is why deep water looks blue."""
u_WaterDistanceFog = """
How far you can see sideways under water, in chunks.

This is the point where the underwater haze closes in completely. Lower means the water is \
murkier; higher opens the view up. It works with Underwater Fog Start Depth below, which sets \
where the haze begins."""

u_WaterDepthFog = """
The same closing distance as above, but measured downward instead of sideways, in chunks.

Kept separate from the sideways distance so a lake can be clear to look across but still turn \
dark below you."""

u_UnderwaterFogStart = """
How far away the underwater haze starts, in chunks.

Inside this distance everything looks fully clear. Raising it keeps things close to you sharp; \
at 0 the haze starts right where you are standing or swimming."""

u_WaterDistanceDarkness = """
How much darker things look the farther away they are, under water.

This is separate from fog: fog paints the water's colour over what you see, while this takes \
light away from it. Together they decide whether distance under water feels misty or feels \
gloomy."""

u_WaterDepthDarkness = """
How much darker things get the deeper under water they are."""

u_WaterDarknessDepth = """
How deep you need to go before the Darker with Depth effect above has fully taken hold, in \
chunks.

Lower makes water turn dark almost right away; higher stretches it out, so only truly deep \
ocean trenches turn black."""

u_UwBlurStart = """
How far away the underwater blur starts, in chunks.

Inside this the view stays sharp. Water scatters light, so distant things look soft as well as \
hazy under water. This is where that begins."""

u_UwBlurEnd = """
How far away the underwater blur reaches its full strength, in chunks.

This is deliberately separate from the fog distance: how soft the water makes things look is a \
property of the water itself, not of how far the fog happens to reach."""

u_UwBlurRadius = """
How far the underwater blur reaches, in screen pixels.

This is how wide the blur is; Underwater Blur Strength below is how much of the picture it is \
allowed to affect. A large blur with low strength gives a gentle haze; both set high gives a \
proper murk."""

u_UwBlurStrength = """
How much detail the underwater blur removes.

At 0 the view stays sharp no matter how large the blur is set. At 1 distant blocks lose their \
edges entirely."""

u_UnderwaterFlowPixels = """
How far the water's flow pushes what you see, in screen pixels.

This is the fine, moving ripple that plays over everything under water. 0 turns it off and \
leaves the view undistorted."""

u_UnderwaterFlowScale = """
How large the ripples from the water's flow are.

Low values give broad, slow swells across the whole view; high values give a tight, busy \
shimmer. It changes the size of the ripple, not how strong it is."""

u_CausticStrength = """
How bright the light pattern on the sea floor is.

This is the web of bright lines the waves focus onto whatever sits below them. It is a plain \
multiplier: 1.0 is the tuned look, and you can push it higher to taste."""

u_CausticGlow = """
How much the sea floor light pattern flares and shimmers rather than sitting still as a steady \
web.

Near the surface the focused light is still sharp, so its brightest points glint. This controls \
how strong that glinting is; 0 leaves a flat, even pattern."""

u_CausticBounce = """
How much of the sea floor light pattern bounces back up onto walls and overhangs.

At 0 the pattern only lands on the floor. Higher throws some of it onto the sides of a trench, \
which is what makes an underwater cave look lit rather than just painted."""

u_CausticGlowDepth = """
How deep the sea floor light keeps its shimmer, in chunks.

The waves at the surface focus this light, so it loses its sharp edges the more water sits \
between the sea floor and them. A lower value means only the top of the water sparkles."""

u_CausticScale = """
How large the light pattern on the sea floor is, as a percentage of its tuned size.

100 is the pattern as it was made. Below 100 tightens it into finer cells; above 100 spreads it \
into broad, slow shapes."""

u_CausticSpeed = """
How fast the light pattern on the sea floor moves, as a percentage of its tuned speed.

0 freezes it in place. Whether this is measured against real time or against the waves depends \
on the Caustic Speed Follows Waves switch below."""

u_CausticSyncWaves = """
Whether the sea floor light pattern moves with the waves or keeps its own clock.

This light is shaped by the waves at the surface, so while this is on, the default, slowing the \
waves down also slows the pattern they focus. Turning it off lets the pattern keep its own pace \
whatever the water is doing. The Caustic Speed slider above still works either way."""

# --- Sky screen ---------------------------------------------------------------------------------

PLAGUE_STAR_AMOUNT = """
How many stars fill the night sky.

The default puts a few hundred stars in view at once, close to what a naked eye sees under a \
dark sky. Dense goes far past that and looks more like a science-fiction sky than Earth's own."""

u_StarDensity = """
A fine adjustment to the star count, on top of the Star Amount setting above.

Star Amount picks how many stars there are overall; this nudges that number without jumping to \
the next setting."""

u_StarBrightness = """
How bright the stars are.

0 removes them without removing the coloured clouds behind them. Bright stars also add to the \
soft glow around bright lights, so turning this up high gives every star a halo."""

u_StarMagnitudeFalloff = """
How steeply the faint stars fade out compared with the bright ones.

Low makes most stars roughly the same brightness, which looks flat and artificial. High fades \
the faint ones away until only a handful of bright stars remain: the same number of stars is \
still there, just fewer that you can actually see."""

u_StarColorSpread = """
How much stars differ in colour from one another.

Real skies mix red giants with blue-white stars. 0 tints every star the same; push it high \
enough and the field starts to look like coloured static rather than stars."""

u_StarSize = """
How large each star is drawn."""

u_StarRoundness = """
The shape of each star, from square at -1.00 through to round at 1.00.

Round is the honest choice for a point of light. Square exists because at very small sizes a \
hard-edged dot can look crisper on some screens."""

u_StarSoftness = """
How feathered the edge of each star looks.

Some feathering is applied automatically so stars do not flicker while you turn to look around. \
This adds more on top. High values give soft, glowing points; 0 leaves them as sharp as they \
can safely be."""

PLAGUE_NEBULA_ENABLED = """
Whether faint clouds of coloured gas show up in the night sky.

Off leaves the stars against plain black. This only shows on clear nights, and never during the \
day."""

u_NebulaIntensity = """
How bright the night sky's coloured clouds are.

Subtle by default. It should be something you notice on a dark, clear night, not the main \
event."""

u_NebulaAmount = """
How much of the sky the coloured clouds cover.

At the default, roughly a tenth of the sky has some gas in it. Raising this grows the clouds \
outward from their brightest points rather than brightening everything at once."""

u_NebulaZoom = """
How large the coloured clouds' shapes are.

Low gives a few broad clouds across the whole sky; high breaks it up into finer, more distant \
detail."""

u_NebulaIonisedOnset = """
How dense the gas must get before it turns from red to teal.

Thin gas glows red; thick enough gas turns teal. This sets how dense it must be for that change \
to start, so lowering it turns more of the cloud teal."""

u_NebulaIonisedWidth = """
How gradual the change from red to teal is.

Narrow gives a hard line between the two colours; wide blends them together through purple \
across most of the cloud."""

u_NebulaStarGlow = """
How much the stars light up the coloured gas around them.

Stars brighten the cloud around them rather than just sitting on top of it, so raising this \
makes them look embedded in it. 0 leaves the gas evenly lit."""

u_NebulaDrift = """
How fast the coloured clouds drift across the sky.

Slow by default. This is on top of the sky's own turning, so even at 0 they still move along \
with the stars."""

PLAGUE_SHOOTING_STARS = """
Whether meteors streak across the night sky.

Off removes them completely and costs nothing."""

PLAGUE_SS_COUNT = """
How many meteors can be in the sky at the same time.

This is not how often they show up; that is the Shooting Star Chance slider. This is the most \
there can ever be, and each one costs a little to draw, so a higher number costs more even when \
none happen to be visible."""

u_ShootingStarChance = """
How often meteors show up.

Low means a rare sight worth looking up for; high turns the sky into a meteor shower."""

u_ShootingStarBrightness = """
How bright each meteor is.

0 leaves them there but invisible; high enough and they leave a glowing trail behind them."""

u_ShootingStarSpeed = """
How fast meteors cross the sky.

Slow looks like a satellite; fast looks like a real meteor."""

u_ShootingStarSize = """
How long each meteor's head is."""

u_ShootingStarThickness = """
How wide each meteor's streak is.

Thin looks like a scratch across the sky; thick looks closer to a fireball."""

u_ShootingStarTrail = """
How far the tail stretches behind the head.

Short gives a bright dot with just a hint of motion; long gives the classic drawn-out streak."""

PLAGUE_AURORA_ENABLED = """
Whether aurora curtains of light appear on clear nights.

Off removes the effect completely, along with its cost."""

PLAGUE_AURORA_CONDITION = """
When the aurora is allowed to appear.

Every clear night makes it a normal part of the world. Full moon only makes it rare enough to \
feel like a special event."""

PLAGUE_AURORA_SAMPLES = """
How carefully the aurora is drawn, and so how much it costs.

Higher settings smooth the curtains out; the fastest ones leave visible bands in them, most \
noticeable near the horizon. This is the aurora's main cost control. Changing this rebuilds \
part of the pack, so it takes a moment to switch instead of updating right away as you drag."""

u_AuroraIntensity = """
How bright the aurora is.

0 leaves it turned on but invisible, which is a simple way to check whether it is what you are \
actually seeing."""

u_AuroraSize = """
How large the curtains are across the sky."""
u_AuroraDetail = """
How fine the pattern inside each light curtain is.

Low gives broad, smooth sheets of light; high breaks them into thin streaks. It does not change \
how bright or how big the aurora is."""

u_AuroraRedOnset = """
How high up the curtain of light turns red.

The colour of the aurora changes with height: green through the middle, red near the top where \
the air is thin. Lowering this number brings the red band further down."""

u_AuroraRedWidth = """
How slowly the colour changes from green to red.

Narrow gives a clear red cap on top of a green curtain; wide blends the two colours together \
through most of its height."""

u_AuroraVioletExtent = """
How far up the curtain the violet fringe at the bottom reaches.

Violet is the lowest and rarest of the three colours. 0 removes it and leaves green from the \
bottom upward."""

# --- Clouds and Shadows screens -----------------------------------------------------------------

CLOUDS_VOLUMETRIC = """
Whether clouds have real depth, or stay a flat painted layer.

On, the side facing the sun lights up, they cast shade on the ground below them, and flying \
into one puts you inside it. It costs more frame rate than any other setting in the pack."""

CLOUD_RESOLUTION = """
How sharp clouds look on screen, from Low up to Epic.

Higher looks cleaner. Lower draws clouds smaller and stretches them back up, which looks \
soft. This costs more than anything else in the pack, so raise it before turning down the \
cloud settings below."""

u_CloudAltitude = """
How high the clouds sit, in blocks.

The clouds start well above build height, so they look like part of the sky. Bring this down \
and you can fly through them."""

u_CloudAmount = """
How much of the sky is covered.

0 gives a clear day no matter the weather. Rain raises this a little on top of what you \
set; see Weather Response."""

u_CloudScale = """
How large individual clouds are.

Low makes many small clouds. High makes a few broad banks."""

u_CloudShadowStrength = """
How dark a cloud's shadow on the ground is.

1 matches how thick the cloud looks from below, so a thin cloud casts a light shadow and \
a fully overcast sky casts a strong one."""

u_CloudTierCumulus = """
The puffy heaped clouds, and the storm towers they can grow into.

Off removes them. Higher settings show more shape and shadow inside each cloud, which is \
where they start looking solid instead of like fog."""

u_CloudTierStratus = """
Flat low cloud: the overcast lid.

Off removes it. A plain grey sheet shows extra detail the least, so this is the first \
one worth turning down for speed."""

u_CloudTierStratocumulus = """
The rolling low banks that sit just above the overcast lid.

Off removes them. They share the lid's height, so turning one off at a time shows which \
layer is doing what."""

u_CloudTierNimbostratus = """
The deep grey deck that rain and thunder fall out of.

Off removes it, so storms fall from open sky instead. It is the thickest deck here, so \
it costs the most during bad weather."""

u_CloudTierAltocumulus = """
Mid-level cloud: the rippled sheets partway up the sky.

Off removes them. Higher settings show more ripple detail and cost more to draw."""

u_CloudTierCirrus = """
High cloud: the thin streaks near the top of the sky.

Off removes them. Higher settings show more fine detail in the streaks and cost more to \
draw."""

u_CloudTierCirrocumulus = """
High cloud: the fine rippled patches that show up in unsettled weather.

Off removes them. Higher settings show more ripple detail and cost more to draw."""

u_CloudDetailFade = """
How far away fine cloud detail lasts, in chunks.

Detail fades by half again each time you move this far sideways through a cloud layer. \
Lower is faster and blurs distant clouds; the highest setting turns the fade off."""

u_CloudFadeCumulus = """
How far past your view distance the heaped fair-weather deck keeps going before it fades \
out, in chunks.

It starts fading where the land stops drawing. Higher shows more of it near the horizon \
and costs more frame rate."""

u_CloudOpacityCumulus = """
How thick the heaped fair-weather deck is, compared with how it was designed.

100% is the deck as designed. Lower lets more sky and other cloud show through it; \
higher makes it darker underneath."""

u_CloudFadeStratus = """
How far past your view distance the flat overcast deck keeps going before it fades out, \
in chunks.

It starts fading where the land stops drawing. Higher shows more of it near the horizon \
and costs more frame rate."""

u_CloudOpacityStratus = """
How thick the flat overcast deck is, compared with how it was designed.

100% is the deck as designed. Lower lets more sky and other cloud show through it; \
higher makes it darker underneath."""

u_CloudFadeStratocumulus = """
How far past your view distance the rolling low deck keeps going before it fades out, in \
chunks.

It starts fading where the land stops drawing. Higher shows more of it near the horizon \
and costs more frame rate."""

u_CloudOpacityStratocumulus = """
How thick the rolling low deck is, compared with how it was designed.

100% is the deck as designed. Lower lets more sky and other cloud show through it; \
higher makes it darker underneath."""

u_CloudFadeNimbostratus = """
How far past your view distance the deep rain deck keeps going before it fades out, in \
chunks.

It starts fading where the land stops drawing. Higher shows more of it near the horizon \
and costs more frame rate."""

u_CloudOpacityNimbostratus = """
How thick the deep rain deck is, compared with how it was designed.

100% is the deck as designed. Lower lets more sky and other cloud show through it; \
higher makes it darker underneath."""

u_CloudFadeAltocumulus = """
How far past your view distance the rippled mid-level deck keeps going before it fades \
out, in chunks.

It starts fading where the land stops drawing. Higher shows more of it near the horizon \
and costs more frame rate."""

u_CloudOpacityAltocumulus = """
How thick the rippled mid-level deck is, compared with how it was designed.

100% is the deck as designed. Lower lets more sky and other cloud show through it; \
higher makes it darker underneath."""

u_CloudFadeCirrocumulus = """
How far past your view distance the fine high-ripple deck keeps going before it fades \
out, in chunks.

It starts fading where the land stops drawing. Higher shows more of it near the horizon \
and costs more frame rate."""

u_CloudOpacityCirrocumulus = """
How thick the fine high-ripple deck is, compared with how it was designed.

100% is the deck as designed. Lower lets more sky and other cloud show through it; \
higher makes it darker underneath."""

u_CloudFadeCirrus = """
How far past your view distance the thin high-streak deck keeps going before it fades \
out, in chunks.

It starts fading where the land stops drawing. Higher shows more of it near the horizon \
and costs more frame rate."""

u_CloudOpacityCirrus = """
How thick the thin high-streak deck is, compared with how it was designed.

100% is the deck as designed. Lower lets more sky and other cloud show through it; \
higher makes it darker underneath."""

u_CloudFadeSoftness = """
How gently clouds fade out at the far edge of view.

0% keeps them crisp until they vanish. 100% melts them into the sky as they go. Clouds \
within your normal view distance are never softened."""

u_CloudSilverLining = """
How much brighter a cloud glows when the sun sits behind it.

A cloud lit from behind glows brightly around its edge, because light passes through its \
thin part and spreads out. 1 makes that glow about eight times brighter than the rest of \
the cloud; 0 treats every side the same. The cloud's size never changes, only how bright \
its edge glows."""

u_CloudSpeed = """
How fast clouds move across the sky.

0 freezes them in place."""

u_CloudWeatherResponse = """
How much rain changes the clouds.

0 keeps the clouds looking like fair weather no matter what the weather actually is. At 1, \
rain builds the clouds taller, darker, and a little more spread out, the way a real sky \
thickens before a storm."""

u_CloudFormHold = """
Freezes the shape of the low clouds where you put it.

Off, the sky picks its own shape from the time of day and the weather. On, the Held Moisture \
and Held Stability sliders below control it directly, so you can look at one shape on purpose \
instead of waiting for it to appear."""

u_CloudMoisture = """
How much of the low air holds moisture, when Hold Cloud Form is on.

A cloud's shape follows where the air is damp, not one fixed type. Raising this makes more of \
the low sky damp; whether that damp air turns into a flat blanket or rising heaps depends on \
Held Stability, below. At 0 only a few scattered patches remain."""

u_CloudStability = """
Whether damp low air spreads out flat or rises into heaps, when Hold Cloud Form is on.

At 0 the air is unstable, and moisture builds heaped cumulus clouds with flat bottoms. At 1 the \
air is capped, and the same moisture spreads into a plain stratus blanket. In between, it \
flattens into rolling stratocumulus. This works together with Held Moisture: stable air with no \
moisture in it stays clear."""

SHADOWS = """
Whether the sun and moon cast real shadows.

Off is a large performance saving and a large visual loss: the world is lit, but nothing blocks \
the light. Every other setting on this page depends on it."""

SHADOW_RESOLUTION = """
How much detail shadows are drawn with.

Higher gives crisper shadow edges, with less of the jagged, stair-step look you can see on \
long shadows, at a cost in memory and frame rate. This is the main speed control for shadows."""
