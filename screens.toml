# Grouped by WHAT EACH CONTROL DOES, so a switch sits with the sliders it governs and you can see
# what turning it off takes away. Every switch here is a real feature, not a diagnostic: each names
# one underwater behaviour and removes exactly that behaviour when off. They replace a single
# "Underwater Bisection" bucket that listed nine of them together with no indication of what any of
# them touched; that name came from bisecting a rendering fault, which is not what a player is doing
# on this page.
