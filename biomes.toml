# IDs this pack picks for each biome. They are not the numbers the game hands out.
# 67 names from Java 26.3. The engine keeps 0 for a biome with no ID here.
# These numbers must stay put: a shader that reads one has to mean the same biome next time.
# 26.2 has no minecraft:dappled_forest. Its line does no harm.
# A biome from a mod needs its own new number here.
# From the official Java 26.3 server bundle, SHA-1 33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c.

