# Plague render graph. Passes execute in declaration order.

[ray_traced_shadows]
enabled_if = "RT_SHADOWS"
distance_option = "u_RtShadowDistance"
blocks_per_unit = 16
# Ray cover budget: 6 * disk radius 2.046826 * rain 3 * ambient 4 + one bilinear texel.
# It does not cap how wide a shadow gets: each tap checks ray depth and reads the raster map
# where ray cover is missing. See shadow_filter.glsl and shadow_handoff.glsl.
filter_guard_texels = 148.371472

# --- Geometry -------------------------------------------------------------------------------------

[[pass]]
name = "terrain"
type = "geometry"
slot = "terrain"
program = "shaders/blocks/terrain"
# builtin.noise is THIRD (u_GeomInput2); terrain.fsh's puddle/ripple/splash/snow calls depend on that
# position — append only, never insert.
# sceneHdrComposited and builtin.depth_opaque are read by the TRANSLUCENT arm only. The opaque
# sub-draws run before the passes that fill them and would read last frame's content with no error.
inputs = ["builtin.spriteBounds", "builtin.spriteHeightRange", "builtin.noise", "waterWaveB.history",
          "sceneHdrComposited", "builtin.depth_opaque", "shoreWetness.history",
          "atmoAerial"]
outputs = []

# Ships both vsh/fsh stages: vanilla's entity vertex shader consumes Normal and never forwards it, so
# a fragment-only stage couldn't write gNormal.
[[pass]]
name = "entities"
type = "geometry"
slot = "entities"
program = "shaders/blocks/entities"
inputs = []
outputs = []


# Fornax maps vanilla's SOLID_BLOCK/CUTOUT_BLOCK pipelines to BLOCK_ENTITIES; claiming this slot is
# what makes the pack program reachable instead of being overpainted by the deferred resolve.
[[pass]]
name = "block_entities"
type = "geometry"
slot = "block_entities"
program = "shaders/blocks/block_entities"
inputs = []
outputs = []

# Fornax maps vanilla's END_PORTAL and END_GATEWAY pipelines here. Both are drawn during the solid
# phase and write depth, so both defer; unclaimed they draw into vanilla's target and this graph's
# own tonemap paints over them, which in game reads as a portal you can see straight through.
[[pass]]
name = "end_portal"
type = "geometry"
slot = "end_portal"
program = "shaders/blocks/end_portal"
inputs = []
outputs = []

# Solid arm only — see particles_translucent for the translucent arm (cannot be deferred). Declaring
# this pass is required for Fornax's hook to defer particles at all.
[[pass]]
name = "particles"
type = "geometry"
slot = "particles"
program = "shaders/blocks/particles"
inputs = []
outputs = []

# FORWARD pass: draws after the resolve, so deferring would write a G-buffer nothing reads and drop
# the translucent blend. Reached via a second engine hook (particles bypass the normal chokepoint
# entirely) and is not claimed under Fabulous Graphics, which uses a separate, non-tonemapped buffer.
[[pass]]
name = "particles_translucent"
type = "geometry"
slot = "particles_translucent"
program = "shaders/blocks/particles_translucent"
inputs = []
outputs = []

# FORWARD pass, writing DISPLAY-space colour straight into builtin.output — the only program in this
# pack that does. Can't be deferred: BANNER_PATTERN has depthWrite = false (refused by
# GeometryPipelineMap) and draws after the resolve regardless.
[[pass]]
name = "banner_patterns"
type = "geometry"
slot = "banner_patterns"
program = "shaders/blocks/banner_patterns"
inputs = []
outputs = []

# NO WEATHER PASS: precipitation bypasses Fornax's deferral chokepoint entirely (its own render pass,
# never routed through drawFromBuffer), so claiming a slot here does nothing. Plague's weather lives
# on the ground instead — wetness, puddles, ripples, splashes.

# Entity shadow casting. The engine replays the already-prepared entity draws a second time with the
# shadow map bound, and this program reprojects them through the light's matrix.
#
# Not in the End. Nothing shines there: the clock never moves, so the sun sits at one angle for ever
# and every pillar would throw a hard edge from a direction that means nothing. gbuffer_resolve.fsh
# zeroes the sun there, so the map is drawn and thrown away. Gating this pass off is how the pack
# declines shadows, and the engine skips the whole phase.
[[pass]]
name = "shadow_entities"
type = "geometry"
slot = "shadow_entities"
runtime_enabled_if = "dimension != 3"
program = "shaders/blocks/shadow_entities"
inputs = []
outputs = []

# --- Ambient occlusion --------------------------------------------------------------------------
# Targets ungated though passes are gated: the resolve reads `ssao` unconditionally, and
# gate-consistency refuses an ungated pass reading a gated target.

# rgba16f, not the resolve writing straight to builtin.output (8-bit): clipping above 1.0 there is
# irrecoverable — no tonemap can recover a sunlit-white value from an already-clipped one.
# Material lighting output, read by the fog pass that runs after it.
[targets.sceneHdrUnfogged]
format = "rgba16f"
scale = 1.0

[targets.sceneHdr]
format = "rgba16f"
scale = 1.0

# Finite water-volume interval ABI. It is deliberately separate from radiance and remains valid for
# a full frame so the half-resolution transport chain can reject stale revisions deterministically.
[targets.waterVolumeInterval]
format = "rgba16f"
scale = 0.5
filter = "linear"
history = true
enabled_if = "PLAGUE_UNDERWATER != 0 && WATER_SCATTERING_QUALITY != 0"

# Current-frame premultiplied single-scatter radiance plus the interval revision in alpha. Temporal
# ownership belongs to the later resolved target, never to this raw integration result.
[targets.waterVolumeScatterRaw]
format = "rgba16f"
scale = 0.5
filter = "linear"
enabled_if = "PLAGUE_UNDERWATER != 0 && WATER_SCATTERING_QUALITY != 0"

# Interval-aware reconstruction owns only scatter radiance history. Alpha remains the current
# interval revision, while the paired interval history supplies the geometric rejection domain.
[targets.waterVolumeScatter]
format = "rgba16f"
scale = 0.5
filter = "linear"
history = true
enabled_if = "PLAGUE_UNDERWATER != 0 && WATER_SCATTERING_QUALITY != 0"

# A is the RG16F intermediate; B stores pressure, velocity and the gradients water shading consumes.
# Graph storage images — the 512x extent is unrelated to resource-pack atlas resolution.
[targets.waterWaveA]
format = "rg16f"
width = 512
height = 512
storage = true

[targets.waterWaveB]
format = "rgba16f"
width = 512
height = 512
storage = true
history = true
filter = "linear"

# Film and soak left on dry blocks by a wave crest clearing their top (shore_spill.glsl). Same
# extent and same actor-centred frame as the wave field above, since it is reprojected by that
# field's own cell shift; the Performance tier writes only its top-left 256x256, exactly as the
# solve does. history = true IS the ping-pong: this pass reads its own previous frame.
[targets.shoreWetness]
format = "rgba16f"
width = 512
height = 512
storage = true
history = true
filter = "linear"

# --- Bounce-light test view ------------------------------------------------------------------
# A 256x256 grid of one bounce ray per cell. The grid is fixed, not a fraction of the screen: the
# ray count is declared once on the trace pass below and a scaled target would not match it.


# Eight floats a ray, 262144 rays: the layout the engine's ray_query pass reads and writes.
[targets.giRayRequests]
kind = "buffer"
stride_bytes = 32
count = 262144
enabled_if = "PLAGUE_GI != 0"

[targets.giRayHits]
kind = "buffer"
stride_bytes = 36
count = 262144
enabled_if = "PLAGUE_GI != 0"

[targets.giShadowRequests]
kind = "buffer"
stride_bytes = 32
count = 262144
enabled_if = "PLAGUE_GI != 0"

[targets.giShadowHits]
kind = "buffer"
stride_bytes = 36
count = 262144
enabled_if = "PLAGUE_GI != 0"

[targets.giBounceRaw]
enabled_if = "PLAGUE_GI != 0"
format = "rgba16f"
width = 512
height = 512
storage = true
# history = true IS the ping-pong: the resolve reads its own previous frame to average the noise
# one ray per cell leaves behind.
history = true
filter = "linear"

# What the world resolve reads, after gi_blur has spread each cell across its neighbours.
# Ungated on purpose: the resolve names it unconditionally, and a gated target read by an ungated
# pass is refused at load. Off, the pass that fills it never runs and it reads as black.
# Engine-filled (Fornax AnalyticLightListBuffer): word 0 the light count, then six words a light.
# No stride or count: the engine sizes it, and skips the scan for a pack that never declares it.
[targets.analyticLightList]
kind = "buffer"

[targets.giLightRequests]
kind = "buffer"
stride_bytes = 32
count = 262144
enabled_if = "PLAGUE_GI != 0"

[targets.giLightHits]
kind = "buffer"
stride_bytes = 36
count = 262144
enabled_if = "PLAGUE_GI != 0"

[targets.giBounce]
format = "rgba16f"
width = 512
height = 512
storage = true
filter = "linear"

# Light straight from the glowing blocks, kept apart from the bounce beside it.
#
# Averaged over frames but never blurred across neighbours. The ray goes at a point on the lamp's
# surface, a different one each frame, so the average IS the fraction of the lamp a cell can see and
# the soft edge comes out of it. Spreading it sideways as well would smear that edge over the room.
#
# Only the GI passes read the raw history. The giDirect target below stays on either way, so the
# world resolve reads plain black from it when the bounce is off.
[targets.giDirectRaw]
enabled_if = "PLAGUE_GI != 0"
format = "rgba16f"
width = 512
height = 512
storage = true
history = true
filter = "linear"

# The same light after one narrow pass over its neighbours. One yes-or-no a frame leaves a cell
# holding one of a handful of answers, which reads as speckle however long the frame average runs.
# One cell either side is about three pixels on screen: enough to settle that, far short of the
# spreading the bounce beside it takes, which would smear the shadow back into a blob.
[targets.giDirect]
format = "rgba16f"
width = 512
height = 512
storage = true
filter = "linear"

# Which way the light in giBounce arrives from, as one vector: its direction is the average bearing
# of everything that reached the cell, its LENGTH is how much those agree. Light from one lamp comes
# out near 1, light from everywhere at once near 0. The resolve needs both to re-apply a pixel's own
# normal to a grid far coarser than the screen.
[targets.giBounceDirRaw]
enabled_if = "PLAGUE_GI != 0"
format = "rgba16f"
width = 512
height = 512
storage = true
history = true
filter = "linear"

[targets.giBounceDir]
format = "rgba16f"
width = 512
height = 512
storage = true
filter = "linear"

# Between the two spreading steps. Nothing outside gi_blur_wide reads these.
[targets.giBounceMid]
enabled_if = "PLAGUE_GI != 0"
format = "rgba16f"
width = 512
height = 512
storage = true
filter = "linear"

[targets.giBounceDirMid]
enabled_if = "PLAGUE_GI != 0"
format = "rgba16f"
width = 512
height = 512
storage = true
filter = "linear"

[targets.waterWaveState]
kind = "buffer"
stride_bytes = 16
# Five vec4s: committed, frame, control, travel, splash. Under the Performance tier's skipped solves,
# "survives a frame" is not the same as "survives a step".
count = 5

[targets.surfaceFluidClipmap]
kind = "buffer"

# Engine-filled (Fornax PrecipCoarseClipmapBuffer): 4-block cells over a 512-block window, four
# words per column: none/rain/snow record; surface temperature behind that decision, downfall,
# biome tags; biome nominal temperature. No stride or count: the engine sizes it, and skips the
# upload for a pack that never declares this target.
[targets.precipCoarseClipmap]
kind = "buffer"

# Engine-filled (Fornax WaterActorBuffer), slot 0 the local actor — no stride/count here since the
# engine sizes it, and skips the whole sweep for any pack that doesn't declare this target.
[targets.waterActors]
kind = "buffer"

# --- Atmosphere -----------------------------------------------------------------------------------
# Four scattering tables, rewritten every frame (no pass can run less often; a table dies on any
# reallocation). Fixed sizes, storage for the compute writers, linear for their readers. Mappings:
# shaders/include/atmo_lut.glsl. Writers and targets are unconditional: the sky, fog and reflection
# consumers require filled tables every frame.
[targets.atmoTransmittance]
format = "rgba16f"
width = 256
height = 64
filter = "linear"
storage = true

[targets.atmoMultiScatter]
format = "rgba16f"
width = 32
height = 32
filter = "linear"
storage = true

[targets.atmoSkyView]
format = "rgba16f"
width = 192
height = 108
filter = "linear"
storage = true

# 34 slices of 32 x 32 screen froxels: 32 depth slices, the sky along each froxel's ray, and the
# frame's transmittance chroma. One texture, because the resolve has one sampler left.
[targets.atmoAerial]
format = "rgba16f"
width = 1088
height = 32
filter = "linear"
storage = true

# First in the frame: nothing before them needs the sky; the resolve needs the sky-view table.
# Each reads the true sun from u_SkyCelestial, never u_SunDirection, so none is on the engine's
# per-pass-name uniform list and its silent permanent-noon default. local_size makes the engine
# derive group counts from the first output; dispatch is the required placeholder.
[[pass]]
name = "atmo_transmittance"
type = "compute"
reuse_when_unchanged = { runtime = ["u_AirDensity", "u_AirTurbidity", "u_AirOzone"], globals = ["u_SkyState.x", "u_FrameState.z"] }
shader = "shaders/compute/atmo_transmittance.comp"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions"]
outputs = ["atmoTransmittance"]

[[pass]]
name = "atmo_multiscatter"
type = "compute"
reuse_when_unchanged = { runtime = ["u_AirDensity", "u_AirTurbidity", "u_AirOzone"], globals = ["u_SkyState.x", "u_FrameState.z"] }
shader = "shaders/compute/atmo_multiscatter.comp"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "atmoTransmittance"]
outputs = ["atmoMultiScatter"]

[[pass]]
name = "atmo_skyview"
type = "compute"
shader = "shaders/compute/atmo_skyview.comp"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "atmoTransmittance", "atmoMultiScatter"]
outputs = ["atmoSkyView"]

[[pass]]
name = "atmo_aerial"
type = "compute"
shader = "shaders/compute/atmo_aerial.comp"
local_size = [16, 16]
dispatch = [1, 1, 1]
# sunShadowMap last: inputs are positional, append only. It lets terrain stop the sun before it
# lights the fog in front of a hill.
inputs = ["globals", "packOptions", "atmoTransmittance", "atmoMultiScatter", "atmoSkyView",
          "sunShadowMap", "sunShadowMapRaw", "rtTerrainShadowDepth", "sunEntityShadowMapRaw"]
outputs = ["atmoAerial"]

[targets.ssaoRaw]
format = "r8"
scale = 1.0
filter = "linear" # The spatial blur combines adjacent box taps bilinearly.

[targets.ssao]
format = "r8"
scale = 1.0

[[pass]]
name = "ssao_raw"
type = "fullscreen"
shader = "shaders/post/ssao.fsh"
enabled_if = "SSAO_ENABLED"
inputs = ["builtin.gNormal", "builtin.depth"]
outputs = ["ssaoRaw"]

[[pass]]
name = "ssao_blur"
type = "fullscreen"
shader = "shaders/post/ssao_blur.fsh"
enabled_if = "SSAO_ENABLED"
inputs = ["ssaoRaw"]
outputs = ["ssao"]

# --- Reflections ----------------------------------------------------------------------------------
# Single mirror ray per pixel (see ssr_trace.fsh for why, not a sampled cone), marched through Hi-Z,
# blurred by roughness, accumulated temporally. Reads `sceneHistory.history`, not this frame's
# sceneHdr — the resolve also writes sceneHdr, and reading it here would close a validator cycle.

# Fast tier: traces and blurs at HALF resolution, then joint-bilateral-upsamples into the full-res
# `ssr` the resolve reads. Same shader files as Fancy — FullscreenPassRunner keys shader identity by
# file path, so resolution reaches the shader only at runtime via textureSize()/u_PassTexelSize.

# Reversed-Z means max IS closest (see hiz_downsample.fsh). FULL RESOLUTION in both tiers — Fast
# halves ray COUNT, not pyramid precision; a half-res pyramid would miss thin geometry entirely.
[targets.hiz]
format = "r32f"
scale = 1.0
enabled_if = "SSR_QUALITY != 0"

[targets.ssrRaw]
format = "rgba16f"
scale = 1.0
enabled_if = "SSR_QUALITY == 2"

# `filter = "linear"` is mandatory, not decorative: PlaguePackLoadsTest fails any scale<1 target left
# at NEAREST, since downsampled targets exist to be read back magnified.
[targets.ssrRawHalf]
format = "rgba16f"
scale = 0.5
filter = "linear"
enabled_if = "SSR_QUALITY == 1"

# Fast's temporal accumulation buffer. The history lives at HALF res, not full: accumulating at full
# res would mean running the blur at full res, which is the 1.84 ms this tier exists to avoid.
[targets.ssrHalf]
format = "rgba16f"
scale = 0.5
filter = "linear"
history = true
enabled_if = "SSR_QUALITY == 1"

# UNGATED like `ssao`/`bloomFinal`: both SSR tiers write this positional resolve input, and `scale`
# can't be switched by `enabled_if`, so Fast stays full-res here and ends in an upsample pass instead.
# Writers must write every pixel, never discard: history ping-pongs by pointer swap, not copy, so a
# discarded pixel shows a value from two frames ago.
[targets.ssr]
format = "rgba16f"
scale = 1.0
history = true

# Prefiltered mip chain over `ssr` (ssr_blur alone caps at a 7x7 kernel, nowhere near a hemisphere
# integral). Separate target rather than mips on `ssr` itself: TargetRegistry can't do history AND
# mipLevels > 1 on one target. Level 0 is a faithful copy of the seed, so the resolve reads this
# INSTEAD of `ssr`. `filter = "linear"` is load-bearing even at scale 1.0 for trilinear-between-mips.
[targets.ssrPrefilter]
format = "rgba16f"
scale = 1.0
filter = "linear"

[[pass]]
name = "hiz"
type = "mipchain"
shader = "shaders/post/hiz_downsample.fsh"
target = "hiz"
enabled_if = "SSR_QUALITY != 0"
inputs = ["builtin.depth"]
outputs = []

# NAME IS LOAD-BEARING: the engine supplies Hi-Z level count in u_Param2 only for passes named exactly
# ssr_trace_fancy/ssr_trace_fast/ssr_trace_water. Rename one and u_Param2 silently stays 0, corrupting every ray.
[[pass]]
name = "ssr_trace_fancy"
type = "fullscreen"
shader = "shaders/post/ssr_trace.fsh"
enabled_if = "SSR_QUALITY == 2"
inputs = ["builtin.gNormal", "builtin.depth", "builtin.gMaterial", "builtin.gMotion", "sceneHistory.history", "hiz"]
outputs = ["ssrRaw"]

# Reads FULL-res depth/Hi-Z despite writing to a half-res target: ssr_trace.fsh derives step size
# from textureSize(u_Input1), not u_PassTexelSize, so Fast shoots a quarter as many rays, not coarser ones.
[[pass]]
name = "ssr_trace_fast"
type = "fullscreen"
shader = "shaders/post/ssr_trace.fsh"
enabled_if = "SSR_QUALITY == 1"
inputs = ["builtin.gNormal", "builtin.depth", "builtin.gMaterial", "builtin.gMotion", "sceneHistory.history", "hiz"]
outputs = ["ssrRawHalf"]

# Not renamed to `ssr_blur_fancy`: unlike the traces (engine-dictated names), this name is free, but
# renaming would invalidate profiler comparisons made against it.
[[pass]]
name = "ssr_blur"
type = "fullscreen"
shader = "shaders/post/ssr_blur.fsh"
enabled_if = "SSR_QUALITY == 2"
inputs = ["ssrRaw", "ssr.history", "builtin.gMotion", "builtin.depth", "builtin.gMaterial", "builtin.gNormal"]
outputs = ["ssr"]

# Same shader as ssr_blur; converts tap spacing through the source/depth texture-size ratio so the
# same authored roughness covers the same screen-space footprint in both tiers.
[[pass]]
name = "ssr_blur_fast"
type = "fullscreen"
shader = "shaders/post/ssr_blur.fsh"
enabled_if = "SSR_QUALITY == 1"
inputs = ["ssrRawHalf", "ssrHalf.history", "builtin.gMotion", "builtin.depth", "builtin.gMaterial", "builtin.gNormal"]
outputs = ["ssrHalf"]

[[pass]]
name = "ssr_upsample"
type = "fullscreen"
shader = "shaders/post/ssr_upsample.fsh"
enabled_if = "SSR_QUALITY == 1"
inputs = ["ssrHalf", "builtin.depth", "builtin.gMaterial"]
outputs = ["ssr"]

# Must be LAST in the reflection chain: seeds from `ssr`, which both tiers finish writing above.
# Gated pass reading an ungated target (`ssr`) is always safe — the opposite direction gate-
# consistency forbids.
#
# UNGATED, and it must stay that way. A MIPCHAIN target is allocated by its own pass, not by its
# declaration: GraphInputResolver looks in the mipchain map first and the target registry second,
# and `ssrPrefilter` is in neither once this pass is gated off. `resolve` reads it unconditionally
# (positional input 11), so at SSR_QUALITY == 0 that read fails; three failed frames and the runner
# disables `resolve` for the rest of the session: no albedo, no land, no sky, no water normals.
# Ungating the target declaration is enough for a plain target (`ssao`, `ssr`) and does nothing
# here. The seed is unwritten at SSR_QUALITY == 0 and never sampled: the resolve's own
# `#if SSR_QUALITY != 0` skips it.
[[pass]]
name = "ssr_prefilter"
type = "mipchain"
shader = "shaders/post/ssr_prefilter_downsample.fsh"
target = "ssrPrefilter"
inputs = ["ssr"]
outputs = []

# --- Bloom ----------------------------------------------------------------------------------------
# Seven levels, each a 7x7 binomial blur of the level above at half its width (see bloom_blur.fsh
# for why derived not tabulated). A level is named for how far down it is: bloomDown16 is a
# sixteenth of the screen on each axis, which is also what its pass is called, so a line in the
# profiler says which level it is. rgba16f: levels are summed, so 8-bit quantisation error would
# compound across all seven before the composite sees it.

[targets.bloomDown4]
format = "rgba16f"
scale = 0.25
filter = "linear"

[targets.bloomDown8]
format = "rgba16f"
scale = 0.125
filter = "linear"

[targets.bloomDown16]
format = "rgba16f"
scale = 0.0625
filter = "linear"

[targets.bloomDown32]
format = "rgba16f"
scale = 0.03125
filter = "linear"

[targets.bloomDown64]
format = "rgba16f"
scale = 0.015625
filter = "linear"

[targets.bloomDown128]
format = "rgba16f"
scale = 0.0078125
filter = "linear"

[targets.bloomDown256]
format = "rgba16f"
scale = 0.00390625
filter = "linear"

# `filter = "linear"` on every bloom target is mandatory, not decoration: each exists only to be read
# back magnified, and NEAREST would turn texels into visible blocks (worst at bloomFinal, quarter
# scale read at full res by tonemap).

# The seven levels combined into one, so tonemap reads a single input rather than seven.
[targets.bloomFinal]
format = "rgba16f"
scale = 0.25
filter = "linear"

# Quarter scale on purpose. A cumulus deck's cell is 57.6 blocks at the shipped Cloud Size, so the
# finest cloud shadow on the ground spans tens of blocks; evaluating it per pixel in the resolve was
# 250-400 dependent hash evaluations on every lit fragment for a signal with no chunk-scale detail.
# Quarter scale: a cloud shadow has no detail finer than a cloud cell, 57.6 blocks at the shipped
# Cloud Size. r32f because TargetFormat offers only r8 and r32f in one channel.
#
# The target is ungated while its pass is gated, matching ssao and ssrPrefilter. "resolve" reads it
# and is never gated off, so gating the target would leave an enabled pass pointing at an
# unallocated one, which fails the pack load. Unwritten is fine: the resolve's own
# `#if CLOUD_SHADOWS && CLOUDS_VOLUMETRIC` never samples it.
[targets.cloudShadowMask]
format = "r32f"
scale = 0.25
filter = "linear"

# Before "resolve", which reads the result. Pass order in this file IS execution order.
[[pass]]
name = "cloud_shadow_mask"
type = "fullscreen"
shader = "shaders/post/cloud_shadow_mask.fsh"
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_SHADOWS"
inputs = ["builtin.depth"]
outputs = ["cloudShadowMask"]

# --- Resolve --------------------------------------------------------------------------------------

# Packs three RGBA8 G-buffer reads into one array texture so the resolve spends one sampler slot
# instead of three (docs/PACK-FORMAT.md, "consolidate exists for the sampler budget"). Layer order
# is this list's order: 0 = gAlbedo, 1 = gMaterial, 2 = gAo, matching gbuffer_resolve.fsh's u_Input1.
[[pass]]
name = "gbuf_consolidate"
type = "consolidate"
inputs = ["builtin.gAlbedo", "builtin.gMaterial", "builtin.gAo"]
outputs = ["consolidatedGbuf"]

# Sparse source radiance is shared by primary and voxel-reflected lighting. The fixed resolve
# input 15 carries direct RGB and cloud-shadow alpha, avoiding an extra live Metal sampler.
# Direct/off are mutually exclusive writers; Off copies the cloud mask without tracing lights.
[targets.voxelSourceWindow]
kind = "buffer"
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0 || PLAGUE_GI != 0"

# Engine-owned: boxes of nearby players, mobs and items, so local light can shadow against them.
# EntityOccluderBuffer in the engine holds the layout; only voxel_local_direct reads it.
[targets.entityOccluders]
kind = "buffer"
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0"

[targets.voxelLocalRadiance]
kind = "buffer"
stride_bytes = 4
count = 174290 # ABI2 header/ranges 71890 + 4096 runs * 25 words

[targets.voxelLocalDirect]
format = "rgba16f"
scale = 1.0
filter = "nearest"

# Both halves in one target, because a fullscreen pass may declare exactly one output. rgb is the
# light with nothing in the way, smooth and carrying the block's texture; alpha is the fraction that
# got through, the only sampled quantity and the only one filtered.
# Visibility averaged over frames. history = true IS the ping-pong: the pass reads its own previous
# frame. Only this one signal is averaged; the light beside it is smooth already.
# How much of each light reaches a pixel, which is where every shadow ray is spent. The screen's
# own size: held smaller it puts vertical bars on every wall it lights, on walls and ceiling alike,
# and a pattern that keeps one screen direction across three surface facings is not in the world.
# What it holds is averaged over frames and spread over neighbours before anything reads it, so a
# quarter of the pixels would carry it if the bars can ever be explained.
[targets.voxelLocalVisibility]
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0"
format = "rgba16f"
scale = 1.0
filter = "linear"

[targets.voxelLocalVisAccum]
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0"
format = "rgba16f"
scale = 1.0
history = true
filter = "linear"

[targets.voxelLocalUnshadowed]
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0"
format = "rgba16f"
scale = 1.0
filter = "nearest"

[[pass]]
name = "voxel_local_sources"
type = "compute"
shader = "shaders/compute/voxel_local_sources.comp"
# The bounce light needs the same per-cell radiance, so this runs for either feature.
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0 || PLAGUE_GI != 0"
dispatch = [64, 1, 1]
inputs = ["globals", "packOptions", "voxelSourceWindow", "voxelSectionState", "voxelFaceTexture",
          "builtin.blockAtlas", "builtin.materialAtlas", "builtin.blockAtlasPages",
          "builtin.materialAtlasPages", "voxelPalette"]
outputs = ["voxelLocalRadiance"]

[[pass]]
name = "voxel_local_direct"
type = "fullscreen"
shader = "shaders/post/voxel_local_direct.fsh"
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0"
inputs = ["builtin.gNormal", "consolidatedGbuf", "builtin.depth", "voxelOccupancy",
          "voxelPayload", "voxelPalette", "voxelBrickSummary", "voxelLocalRadiance",
          "builtin.gMotion", "builtin.blockAtlas", "voxelFaceTexture", "cloudShadowMask",
          "entityOccluders"]
outputs = ["voxelLocalUnshadowed"]

# Same walk of the emitters, on a quarter of the pixels, and only the half of it that needs rays.
[[pass]]
name = "voxel_local_visibility"
type = "fullscreen"
shader = "shaders/post/voxel_local_visibility.fsh"
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0"
inputs = ["builtin.gNormal", "consolidatedGbuf", "builtin.depth", "voxelOccupancy",
          "voxelPayload", "voxelPalette", "voxelBrickSummary", "voxelLocalRadiance",
          "builtin.gMotion", "builtin.blockAtlas", "voxelFaceTexture", "cloudShadowMask",
          "entityOccluders"]
outputs = ["voxelLocalVisibility"]

[[pass]]
# Frames are the cheap axis: the same surface under the same lamp answers the same every frame, so
# averaging over time costs no extra marches.
name = "voxel_local_accum"
type = "fullscreen"
shader = "shaders/post/voxel_local_accum.fsh"
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0"
inputs = ["voxelLocalVisibility", "voxelLocalVisAccum.history", "builtin.gMotion", "builtin.depth",
          "builtin.gNormal"]
outputs = ["voxelLocalVisAccum"]

[[pass]]
# One emitter sample per quarter face leaves a dither, and that dither lives entirely in the
# visibility. Filtering it here clears the dither and cannot touch the block's texture or relief,
# because neither is in this signal.
name = "voxel_local_combine"
type = "fullscreen"
shader = "shaders/post/voxel_local_combine.fsh"
enabled_if = "PLAGUE_LOCAL_LIGHTING != 0"
inputs = ["voxelLocalUnshadowed", "builtin.depth", "builtin.gNormal", "cloudShadowMask",
          "voxelLocalVisAccum"]
outputs = ["voxelLocalDirect"]

[[pass]]
name = "voxel_local_off"
type = "fullscreen"
shader = "shaders/post/voxel_local_off.fsh"
enabled_if = "PLAGUE_LOCAL_LIGHTING == 0"
inputs = ["cloudShadowMask"]
outputs = ["voxelLocalDirect"]

# The shared receiver handoff combines RT terrain with independent entity depth before filtering.
# The complete raster map remains available per tap; clouds keep their separate transmittance.
# history = true: a chunk rebuild burst can leave every screen-space ray unanswered for a whole
# frame, and the composite pass holds this same target's own previous frame for those pixels rather
# than falling through to the raster fallback, which reads as full light with the raster map off.
[targets.rtShadowComposite]
format = "rgba16f"
scale = 1.0
filter = "nearest"
history = true

# One sun ray a screen pixel, read straight through with no history and no filter, so a lattice or
# a set of separate rails keeps its own outline instead of landing on one light-space texel. The
# count is a literal sized for a 1728x1084 window; a larger one leaves the tail of the screen
# without a ray, and the composite pass falls back to the raster map there.
#
# sunShadowHits is read by resolve_hdr_rt_shadow, whose own gate is "SHADOWS || RT_SHADOWS", wider
# than the trace that fills it. Its gate has to match that wider condition or the pack refuses to
# load whenever raster shadows run without the traced ones: with the trace compiled out, the buffer
# holds the zero fill it gets at allocation, which reads as no ray answered.
[targets.sunShadowRequests]
kind = "buffer"
stride_bytes = 32
count = 2097152
enabled_if = "RT_SHADOWS"

[targets.sunShadowHits]
kind = "buffer"
stride_bytes = 36
count = 2097152
enabled_if = "SHADOWS || RT_SHADOWS"

[[pass]]
name = "sun_shadow_seed"
type = "compute"
shader = "shaders/compute/sun_shadow_seed.comp"
enabled_if = "RT_SHADOWS"
# A buffer-only output has no extent to derive a dispatch from, so the count is a literal and the
# group size comes from the shader's own local_size_x of 256: 8192 groups times 256 is 2097152.
dispatch = [8192, 1, 1]
inputs = ["globals", "packOptions", "builtin.depth", "builtin.gNormal"]
outputs = ["sunShadowRequests"]

[[pass]]
# Visibility, not closest hit: this only asks whether anything stands between the surface and the
# sun, so a traversal may stop at the first thing it meets.
name = "sun_shadow_trace"
type = "ray_query"
enabled_if = "RT_SHADOWS"
inputs = ["sunShadowRequests"]
outputs = ["sunShadowHits"]

[pass.ray_query]
kind = "visibility"
rays = 2097152
# The mesh tier is the only one that alpha-tests real lattice and rail triangles against their
# baked texture coordinates. Naming it as the floor makes that shape fidelity a fact about the
# pass, not a hope about which machine runs it.
min_tier = "hardware_mesh"

[[pass]]
name = "resolve_hdr_rt_shadow"
type = "fullscreen"
shader = "shaders/post/rt_shadow_composite.fsh"
enabled_if = "SHADOWS || RT_SHADOWS"
# sunShadowHits, then rtShadowComposite.history last: inputs are positional, append only.
inputs = ["builtin.depth", "builtin.gNormal", "sunShadowMap", "builtin.depth", "builtin.depth", "sunShadowMapRaw", "builtin.depth", "builtin.depth", "rtTerrainShadowDepth", "sunEntityShadowMapRaw", "builtin.gMotion", "sunShadowHits", "rtShadowComposite.history"]
outputs = ["rtShadowComposite"]

[[pass]]
# Bounce-light test view. Seeded here because the G-buffer is complete and the bounce needs its
# depth and normal; the trace and the resolve follow before anything reads the colour.
name = "gi_seed_rays"
type = "compute"
shader = "shaders/compute/gi_seed_rays.comp"
enabled_if = "PLAGUE_GI != 0"
# No local_size: a buffer-only output has no extent to derive a dispatch from, so the count is
# literal and the group size comes from the shader's own layout.
dispatch = [1024, 1, 1]
# giBounceRaw.history is read only for imageSize: its extent is the grid this pass lays its rays
# out over, appended last so the requests output is the only binding it moves.
inputs = ["globals", "packOptions", "builtin.depth", "builtin.gNormal", "giBounceRaw.history"]
outputs = ["giRayRequests"]

[[pass]]
# No shader and no hardware named: the engine routes the batch to the best traversal the machine
# has, so the same declaration is answered by mesh tracing on one machine and a voxel march on
# another.
name = "gi_trace"
type = "ray_query"
enabled_if = "PLAGUE_GI != 0"
inputs = ["giRayRequests"]
outputs = ["giRayHits"]

[pass.ray_query]
# hardware_mesh is a floor here. Only the mesh tier carries texture coordinates, and without them
# a hit has no albedo to read, so an answer from any other tier tells this pass nothing it can use.
min_tier = "hardware_mesh"
kind = "closest_hit"
rays = 262144

[[pass]]
name = "gi_shadow_seed"
type = "compute"
shader = "shaders/compute/gi_shadow_seed.comp"
enabled_if = "PLAGUE_GI != 0"
dispatch = [1024, 1, 1]
# giBounceRaw.history is read only for imageSize: its extent is the grid this pass lays its rays
# out over, appended last so the shadow requests output is the only binding it moves.
inputs = ["globals", "packOptions", "giRayRequests", "giRayHits", "giBounceRaw.history"]
outputs = ["giShadowRequests"]

[[pass]]
# Visibility, not closest hit: this asks whether anything stands between the hit and the sun, so a
# traversal may stop at the first thing it meets instead of looking for the nearest.
name = "gi_shadow_trace"
type = "ray_query"
enabled_if = "PLAGUE_GI != 0"
inputs = ["giShadowRequests"]
outputs = ["giShadowHits"]

[pass.ray_query]
kind = "visibility"
rays = 262144

[[pass]]
# Known to the engine by name: it sizes analyticLightList and dispatches the scan behind these.
name = "light_list_reset"
type = "compute"
shader = "shaders/compute/light_list_reset.comp"
enabled_if = "PLAGUE_GI != 0"
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions"]
outputs = ["analyticLightList"]

[[pass]]
name = "light_list_build"
type = "compute"
shader = "shaders/compute/light_list_build.comp"
enabled_if = "PLAGUE_GI != 0"
# THE ENGINE REPLACES THIS. It knows the pass by name and sizes a cube of groups around the camera
# from the live voxel window, so the value here is never the one that runs. The shader's own
# local_size of 4 by 4 by 4 is the half of this the engine does read, through the group count it
# divides by, so that one is a contract and this one is a placeholder.
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "voxelLocalRadiance"]
outputs = ["analyticLightList"]

[[pass]]
name = "gi_light_seed"
type = "compute"
shader = "shaders/compute/gi_light_seed.comp"
enabled_if = "PLAGUE_GI != 0"
dispatch = [1024, 1, 1]
# giBounceRaw.history is read only for imageSize: its extent is the grid this pass lays its rays
# out over, appended last so the light requests output is the only binding it moves.
inputs = ["globals", "packOptions", "analyticLightList", "builtin.depth", "builtin.gNormal",
          "giBounceRaw.history"]
outputs = ["giLightRequests"]

[[pass]]
# Visibility: this asks whether anything stands between the surface and the light, so a traversal
# may stop at the first thing it meets.
name = "gi_light_trace"
type = "ray_query"
enabled_if = "PLAGUE_GI != 0"
inputs = ["giLightRequests"]
outputs = ["giLightHits"]

[pass.ray_query]
kind = "visibility"
rays = 262144

[[pass]]
name = "gi_resolve"
type = "compute"
shader = "shaders/compute/gi_resolve.comp"
enabled_if = "PLAGUE_GI != 0"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "giRayHits", "giShadowHits", "builtin.blockAtlas",
          "giBounceRaw.history", "builtin.gMotion", "builtin.depth", "atmoSkyView", "giRayRequests",
          "analyticLightList", "giLightHits", "builtin.gNormal", "atmoTransmittance",
          "giBounceDirRaw.history", "giDirectRaw.history"]
outputs = ["giBounceRaw", "giBounceDirRaw", "giDirectRaw"]

[[pass]]
name = "gi_blur"
type = "compute"
shader = "shaders/compute/gi_blur.comp"
enabled_if = "PLAGUE_GI != 0"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "giBounceRaw", "builtin.depth", "giBounceDirRaw",
          "giDirectRaw"]
outputs = ["giBounceMid", "giBounceDirMid", "giDirect"]

[[pass]]
# Second spreading step, taps two cells apart. Separate pass rather than a wider loop in the first:
# every cell it reads is already an average, so the same tap count reaches far further.
name = "gi_blur_wide"
type = "compute"
shader = "shaders/compute/gi_blur_wide.comp"
enabled_if = "PLAGUE_GI != 0"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "giBounceMid", "builtin.depth", "giBounceDirMid"]
outputs = ["giBounce", "giBounceDir"]

[[pass]]
name = "resolve"
type = "fullscreen"
shader = "shaders/post/gbuffer_resolve.fsh"
# u_InputN is positional, so append only. Buffer inputs go last (usamplerBuffer, not sampler2D).
# Input12 stays empty on purpose; the shadow prepass puts its raw debug map at input18.
# consolidatedGbuf (u_Input1) is gbuf_consolidate's output, not a [targets.*] entry. See that
# pass's own comment.
# rtShadowComposite (u_Input18) holds direct and wide ambient shadow from one combined pass;
# both use the world-position RT/raster handoff through the shared shadow filter.
# u_Input19 stays reserved (bound to builtin.depth), so no input numbers shift.
inputs = ["builtin.gNormal", "consolidatedGbuf", "builtin.depth", "builtin.lightmap", "sunShadowMap", "ssao", "builtin.gMotion", "builtin.celestials", "builtin.noise", "ssrPrefilter", "builtin.waterDepth", "causticsTexture", "builtin.depth", "moonAlbedo", "moonNormal", "voxelLocalDirect", "atmoSkyView", "atmoAerial", "rtShadowComposite", "builtin.depth", "giBounce", "giBounceDir", "giDirect"]
outputs = ["sceneHdrUnfogged"]

# resolve_hdr is the name Fornax expects for the pass that reads render distance, debug view and
# active light. It runs right after material resolve and reads the same depth. It just copies its
# input through when fog is off, on sky, or for other debug views.
[[pass]]
name = "resolve_hdr"
type = "fullscreen"
shader = "shaders/post/fog_composite.fsh"
inputs = ["sceneHdrUnfogged", "builtin.depth", "consolidatedGbuf", "builtin.waterDepth",
          "atmoTransmittance", "atmoMultiScatter", "atmoSkyView", "atmoAerial", "builtin.noise",
          "sunShadowMap", "sunShadowMapRaw", "rtTerrainShadowDepth", "sunEntityShadowMapRaw"]
outputs = ["sceneHdr"]

# Tileable grayscale focusing pattern, sampled by two rotated flowing layers with mirror-repeat UVs.
# Consumed by gbuffer_resolve (seabed projection) and water_composite (surface shimmer).
[textures.causticsTexture]
file = "shaders/textures/water_caustics.png"

# The moon's surface, equirectangular with the near side at the centre. Both built by
# tools/generate_moon_maps.py from the NASA CGI Moon Kit; see ASSETS.md. The normal is baked rather
# than read from height in the shader: the elevation terraces over 8 bits, and its gradient needs a
# cos(latitude) metric.
[textures.moonAlbedo]
file = "shaders/textures/moon_albedo.png"

[textures.moonNormal]
file = "shaders/textures/moon_normal.png"

# Seamless sea-foam pattern: a bubble-film web, connected bright films with darker holes. Built by
# tools/generate_foam.py, see water_composite.fsh's own foam block for why noise alone cannot
# produce foam's actual shape.
[textures.foamTexture]
file = "shaders/textures/water_foam.png"

# Green channel points DOWN, so water_composite.fsh flips it before decoding. No smoothness channel:
# foam roughness is authored in the shader, not sampled.
[textures.foamNormalTexture]
file = "shaders/textures/water_foam_n.png"

# Source height field for the pattern/normal pair, used for foam relief (POM). Seamless by
# construction — matters more here than elsewhere since the shader tiles it across world XZ at two
# scales at once.
[textures.foamHeightTexture]
file = "shaders/textures/water_foam_h.png"

# --- Water ------------------------------------------------------------------------------------
# Runs AFTER the resolve: the water trace reads THIS frame's sceneHdr (not last frame's, like the
# opaque SSR trace), since its origin surface was never in the G-buffer to reproject from.
#
# EVERY PASS AND TARGET HERE MUST CARRY THE SAME GATE, BY HAND — GraphValidator can't verify it
# (Fornax pins the invariant separately in WaterPrepassLockstepTest).

[targets.ssrWaterRaw]
format = "rgba16f"
scale = 1.0
enabled_if = "SSR_WATER_MODE > 1 && SSR_QUALITY != 0"

[targets.ssrWater]
format = "rgba16f"
scale = 1.0
history = true
enabled_if = "SSR_WATER_MODE > 0"

# Fixed-size graph images containing Plague's directional sky radiance and its filtered hierarchy.
# They are independent of resource-pack texture resolution and never enter the pack texture loader.
[targets.waterEnvironmentSeed]
format = "rgba16f"
width = 128
height = 128
filter = "linear"
enabled_if = "SSR_WATER_MODE > 0"

[targets.waterEnvironment]
format = "rgba16f"
width = 128
height = 128
filter = "linear"
enabled_if = "SSR_WATER_MODE > 0"

# Exists to break a validator cycle: water_composite can't blend into sceneHdr, since the trace reads
# sceneHdr and GraphValidator treats any reader as depending on ALL writers of a target.
# UNGATED, with its copy pass: bloom/tonemap read it every frame unconditionally, and a gated target
# read by an ungated pass is refused by gate-consistency.
[targets.sceneHdrComposited]
format = "rgba16f"
scale = 1.0

# --- Clouds -----------------------------------------------------------------------------------
# HDR, before the tonemap, not display-space after it: a sunlit cloud top exceeds 1.0, and clipping
# it flat white before the tonemap loses that information the same way clipping sceneHdr would.
#
# Composited INTO sceneHdr itself, before scene_hdr_copy: the march reads only depth/noise (no
# validator cycle), water_composite then blends the water surface over both sky and clouds (water is
# in front), and ssr_trace_water reads sceneHdr so reflections carry the same clouds as the direct view.
#
# The cloud march fades toward the same scattering sky-view table used by the resolve. Terrain
# and water apply aerial fog in their own shaders; there is no separate fullscreen fog pass.

# PREMULTIPLIED (rgb*a, a) — see clouds_composite.fsh. `filter = "linear"` is mandatory on the
# half-scale target (PlaguePackLoadsTest), free on the full-scale one.
#
# The live march runs as a compute pass: a fullscreen pipeline's reflection accepts only 2D/Cube
# samplers, so it cannot bind the 3D shape volumes below, while a compute pass's descriptor build
# has no such restriction.

# Diagnostics and the two-frame blend share fresh history; neither skips cloud rays.
# Both Off remove the added work. State width comes from derive_cloud_history_state.py.

# Cloud shape noise, generated by tools/generate_cloud_noise.py; see that script's own header for
# why Worley rather than value noise. Two separate volumes, not one packed multi-channel texture,
# so each tiles at its own appropriate world scale (base shape coarse, detail fine).
[textures.cloudBaseShape]
file = "shaders/textures/cloud_base_shape.vol"
depth = 96
width = 96
height = 96
format = "r8"

[textures.cloudDetailShape]
file = "shaders/textures/cloud_detail.vol"
depth = 32
width = 32
height = 32
format = "r8"

# Rebuilt before every march. Storage dependency makes the completed atlas visible to all
# resolution/history variants. A stale atlas could erase clouds silently, so it has no history.
[targets.cloudCandidateMask]
format = "r32f"
width = 512
height = 3585
storage = true
enabled_if = "CLOUDS_VOLUMETRIC"

[[pass]]
name = "clouds_candidates"
type = "compute"
shader = "shaders/compute/clouds_candidates.comp"
enabled_if = "CLOUDS_VOLUMETRIC"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "cloudBaseShape", "cloudDetailShape", "precipCoarseClipmap", "atmoSkyView", "atmoTransmittance"]
outputs = ["cloudCandidateMask"]

[targets.cloudsVolumeCompute]
format = "rgba16f"
scale = 0.5
filter = "linear"
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsVolumeDistance]
format = "r32f"
scale = 0.5
filter = "linear"
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

# Seven independent layers retain float32 march results until the merge.
# Same-size targets avoid scaled-atlas rounding errors at odd viewport dimensions.
[targets.cloudsLayerColour0]
format = "rgba32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerFront0]
format = "r32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerColour1]
format = "rgba32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerFront1]
format = "r32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerColour2]
format = "rgba32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerFront2]
format = "r32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerColour3]
format = "rgba32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerFront3]
format = "r32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerColour4]
format = "rgba32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerFront4]
format = "r32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerColour5]
format = "rgba32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerFront5]
format = "r32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerColour6]
format = "rgba32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[targets.cloudsLayerFront6]
format = "r32f"
scale = 0.5
storage = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"

[[pass]]
name = "clouds_march_volume"
type = "compute"
shader = "shaders/compute/clouds_march_volume.comp"
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1"
local_size = [16, 16]
# X/Y follow the first layer target; Z assigns one workgroup plane to each of seven decks.
dispatch = [1, 1, 7]
inputs = ["globals", "packOptions", "cloudBaseShape", "cloudDetailShape", "precipCoarseClipmap", "atmoSkyView", "atmoTransmittance", "cloudCandidateMask"]
outputs = ["cloudsLayerColour0", "cloudsLayerFront0", "cloudsLayerColour1", "cloudsLayerFront1", "cloudsLayerColour2", "cloudsLayerFront2", "cloudsLayerColour3", "cloudsLayerFront3", "cloudsLayerColour4", "cloudsLayerFront4", "cloudsLayerColour5", "cloudsLayerFront5", "cloudsLayerColour6", "cloudsLayerFront6"]

[[pass]]
name = "clouds_merge_layers"
type = "compute"
shader = "shaders/compute/clouds_merge_layers.comp"
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1 && PLAGUE_CLOUD_HISTORY_DEBUG == 0 && FX_TAA == 0"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "cloudBaseShape", "cloudDetailShape", "precipCoarseClipmap", "atmoSkyView", "atmoTransmittance", "cloudCandidateMask",
          "cloudsLayerColour0", "cloudsLayerFront0", "cloudsLayerColour1", "cloudsLayerFront1", "cloudsLayerColour2", "cloudsLayerFront2", "cloudsLayerColour3", "cloudsLayerFront3", "cloudsLayerColour4", "cloudsLayerFront4", "cloudsLayerColour5", "cloudsLayerFront5", "cloudsLayerColour6", "cloudsLayerFront6"]
outputs = ["cloudsVolumeCompute", "cloudsVolumeDistance"]

[targets.cloudHistory]
format = "rgba16f"
scale = 0.5
storage = true
history = true
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1 && (PLAGUE_CLOUD_HISTORY_DEBUG != 0 || FX_TAA != 0)"

[targets.cloudHistoryData]
format = "r32f"
scale = 0.5
