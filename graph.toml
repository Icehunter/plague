shader = "shaders/post/water_volume_scatter_history.fsh"
enabled_if = "PLAGUE_UNDERWATER != 0 && WATER_SCATTERING_QUALITY != 0"
inputs = ["waterVolumeScatterRaw", "waterVolumeScatter.history", "waterVolumeInterval", "waterVolumeInterval.history"]
outputs = ["waterVolumeScatter"]

# Name-keyed like ssr_trace_water, for the render-distance anchor its fog border needs.
# Destination absent from inputs: blend-only write (see the convention note on clouds_composite).
[[pass]]
name = "water_composite"
type = "fullscreen"
shader = "shaders/post/water_composite.fsh"
# The ENGINE's own pre-pass gate, WaterSurfaceManager.shouldRenderPrepass, which reads
# SSR_WATER_MODE alone. This pass shades the water surface: waves, normals, foam, caustics, body
# colour, glint, distance fog, the Snell-window discs. SSR_QUALITY, the OPAQUE reflection option,
# must not decide whether water has waves. Must match terrain.fsh's forward-arm discard
# exactly, or both draw water or neither does; verify_graph_resolves.py pins the pair.
enabled_if = "SSR_WATER_MODE > 0"
blend = "translucent"
# 15 samplers. Metal allows 16 per fragment function and refuses the pipeline above that, with
# nothing in the log but a compile error and a water surface that renders as vanilla flat blue.
# Inputs are positional: append only, and check this count before adding one.
inputs = ["builtin.waterNormal", "builtin.waterDepth", "ssrWater", "builtin.depth", "builtin.noise", "glintOcclusion", "foamTexture", "foamNormalTexture", "foamHeightTexture", "waterEnvironment", "moonAlbedo", "moonNormal", "cloudFront", "atmoSkyView", "atmoAerial"]
outputs = ["sceneHdrComposited"]

# Placed after the last scene writer, BEFORE bloom and underwater_refraction: accumulating a
# bloom-included frame let a bright mover's halo hold the anti-ghost clamp open, dragging a permanent
# comet tail behind every star (tools/verify_star_trails.py). Degrades to an identity copy under
# anything but TAA, so the chain stays valid at every AA method.
[targets.sceneHdrTemporal]
format = "rgba16f"
scale = 1.0
history = true

[[pass]]
name = "temporal_accumulate"
type = "temporal"
inputs = ["sceneHdrComposited"]
outputs = ["sceneHdrTemporal"]

# Reads the accumulated scene; dry camera gets a passthrough copy. UNGATED like sceneHdrComposited:
# bloom/tonemap read it unconditionally, and a gated target read by an ungated pass is refused.
[targets.sceneHdrRefracted]
format = "rgba16f"
scale = 1.0

# Ungated because tonemap consumes it unconditionally. Allocation clears to transparent zero; the
# active submerged writer also writes zero for every invalid or dry pixel.
[targets.waterVolumeShaftsResolved]
format = "rgba16f"
scale = 1.0

# Post-TAA, same reason underwater_refraction sits here: a warp before accumulation displaces
# pixels TAA then reprojects against unwarped motion vectors. UNGATED: read unconditionally next.
[targets.sceneHdrShimmer]
format = "rgba16f"
scale = 1.0

[[pass]]
name = "heat_shimmer"
type = "fullscreen"
shader = "shaders/post/heat_shimmer.fsh"
inputs = ["sceneHdrTemporal", "builtin.depth", "builtin.gNormal", "builtin.gAo", "builtin.noise"]
outputs = ["sceneHdrShimmer"]

[[pass]]
name = "underwater_refraction"
type = "fullscreen"
shader = "shaders/post/underwater_refraction.fsh"
enabled_if = "PLAGUE_UNDERWATER == 0 || WATER_SCATTERING_QUALITY == 0"
inputs = ["sceneHdrShimmer", "builtin.depth", "builtin.noise", "builtin.waterDepth"]
outputs = ["sceneHdrRefracted"]

[[pass]]
name = "underwater_refraction_shafts"
type = "fullscreen"
shader = "shaders/post/underwater_refraction.fsh"
enabled_if = "PLAGUE_UNDERWATER != 0 && WATER_SCATTERING_QUALITY != 0"
inputs = ["sceneHdrShimmer", "builtin.depth", "builtin.noise", "builtin.waterDepth"]
outputs = ["sceneHdrRefracted"]

[[pass]]
name = "water_volume_composite_submerged"
type = "fullscreen"
shader = "shaders/post/water_volume_composite_submerged.fsh"
enabled_if = "PLAGUE_UNDERWATER != 0 && WATER_SCATTERING_QUALITY != 0"
inputs = ["sceneHdrRefracted", "waterVolumeScatter", "waterVolumeInterval", "builtin.depth", "builtin.waterDepth", "builtin.waterNormal", "sunShadowMap", "builtin.noise", "sunShadowMapRaw", "rtTerrainShadowDepth", "sunEntityShadowMapRaw"]
outputs = ["waterVolumeShaftsResolved"]

# Refraction must run first: the blur consumes sceneHdrRefracted. Tonemap reconstructs the half-res
# blur against full-resolution depth so silhouettes stay sealed.
#
# These two targets have no enabled_if: tonemap.fsh always binds underwaterBlurred, even though its
# own read is gated in the shader (`#if PLAGUE_UNDERWATER && WATER_BLUR`), so the texture must exist
# in every arm. Only the two passes below are gated: each shader already turns into a plain copy
# when its option is off, so skipping the pass saves the draw without breaking that binding.
[targets.underwaterBlurH]
format = "rgba16f"
scale = 0.5
filter = "linear"

[targets.underwaterBlurred]
format = "rgba16f"
scale = 0.5
filter = "linear"

[[pass]]
name = "underwater_blur_h"
type = "fullscreen"
shader = "shaders/post/underwater_blur_h.fsh"
enabled_if = "PLAGUE_UNDERWATER != 0 && WATER_BLUR != 0"
inputs = ["sceneHdrRefracted", "builtin.depth", "builtin.waterDepth"]
outputs = ["underwaterBlurH"]

[[pass]]
name = "underwater_blur_v"
type = "fullscreen"
shader = "shaders/post/underwater_blur_v.fsh"
enabled_if = "PLAGUE_UNDERWATER != 0 && WATER_BLUR != 0"
inputs = ["underwaterBlurH", "builtin.depth", "builtin.waterDepth"]
outputs = ["underwaterBlurred"]

# Same shape as the underwater pair above: reads the finished refraction, reconstructed against
# full-resolution depth in tonemap.fsh.
[targets.heatBlurH]
format = "rgba16f"
scale = 0.5
filter = "linear"

[targets.heatBlurred]
format = "rgba16f"
scale = 0.5
filter = "linear"

# Nether only. Both shaders return a straight copy anywhere else, so elsewhere this is a full-screen
# read and write twice a frame for a picture nothing samples: tonemap.fsh reads heatBlurred only
# under u_WorldBounds.w == 2.0. The targets keep what they last held, so stale is safe.
[[pass]]
name = "heat_blur_h"
type = "fullscreen"
shader = "shaders/post/heat_blur_h.fsh"
runtime_enabled_if = "dimension == 2"
inputs = ["sceneHdrRefracted"]
outputs = ["heatBlurH"]

[[pass]]
name = "heat_blur_v"
type = "fullscreen"
shader = "shaders/post/heat_blur_v.fsh"
runtime_enabled_if = "dimension == 2"
inputs = ["heatBlurH"]
outputs = ["heatBlurred"]

# Four ordered solver stages: prepare derives the moving-window shift, the middle stages advance
# pressure/velocity and generate gradients, commit preserves the fractional shift remainder.
[[pass]]
name = "water_prepare"
type = "compute"
shader = "shaders/compute/water_prepare.comp"
enabled_if = "PLAGUE_WATER_INTERACTION != 0"
inputs = ["globals"]
outputs = ["waterWaveState"]
dispatch = [1, 1, 1]

[[pass]]
name = "water_step_a_quality"
type = "compute"
shader = "shaders/compute/water_step_a.comp"
enabled_if = "PLAGUE_WATER_INTERACTION == 2"
inputs = ["globals", "waterWaveState", "surfaceFluidClipmap", "waterWaveB.history", "waterActors"]
outputs = ["waterWaveA"]
dispatch = [16, 16, 1]

[[pass]]
name = "water_step_b_quality"
type = "compute"
shader = "shaders/compute/water_step_b.comp"
enabled_if = "PLAGUE_WATER_INTERACTION == 2"
inputs = ["globals", "waterWaveState", "surfaceFluidClipmap", "waterWaveA", "waterActors"]
outputs = ["waterWaveB"]
dispatch = [16, 16, 1]

[[pass]]
name = "water_step_a_performance"
type = "compute"
shader = "shaders/compute/water_step_a.comp"
enabled_if = "PLAGUE_WATER_INTERACTION == 1"
inputs = ["globals", "waterWaveState", "surfaceFluidClipmap", "waterWaveB.history", "waterActors"]
outputs = ["waterWaveA"]
dispatch = [8, 8, 1]

[[pass]]
name = "water_step_b_performance"
type = "compute"
shader = "shaders/compute/water_step_b.comp"
enabled_if = "PLAGUE_WATER_INTERACTION == 1"
inputs = ["globals", "waterWaveState", "surfaceFluidClipmap", "waterWaveA", "waterActors"]
outputs = ["waterWaveB"]
dispatch = [8, 8, 1]

# After step_b, so the interaction pressure it reads is this frame's solved field rather than last
# frame's history. surfaceFluidClipmap must stay THIRD: surface_fluid.glsl hardcodes binding 2, and
# a compute pass's bindings are its inputs-then-outputs positionally, so packOptions follows it.
[[pass]]
name = "water_shore_quality"
type = "compute"
shader = "shaders/compute/water_shore.comp"
enabled_if = "PLAGUE_SHORE_SPILL != 0 && PLAGUE_WATER_INTERACTION == 2"
inputs = ["globals", "waterWaveState", "surfaceFluidClipmap", "packOptions", "waterWaveB",
          "shoreWetness.history", "builtin.noise"]
outputs = ["shoreWetness"]
dispatch = [32, 32, 1]

[[pass]]
name = "water_shore_performance"
type = "compute"
shader = "shaders/compute/water_shore.comp"
enabled_if = "PLAGUE_SHORE_SPILL != 0 && PLAGUE_WATER_INTERACTION == 1"
inputs = ["globals", "waterWaveState", "surfaceFluidClipmap", "packOptions", "waterWaveB",
          "shoreWetness.history", "builtin.noise"]
outputs = ["shoreWetness"]
dispatch = [16, 16, 1]

[[pass]]
name = "water_commit"
type = "compute"
shader = "shaders/compute/water_commit.comp"
enabled_if = "PLAGUE_WATER_INTERACTION != 0"
inputs = []
outputs = ["waterWaveState"]
dispatch = [1, 1, 1]

# scale = 0.0 floors to 1x1. UNGATED: always-allocated regardless of writer, keeping the input table
# stable across option flips. history = true because the per-frame self-blend in
# exposure_measure.fsh IS the adaptation smoothing, not a separate pass.
[targets.exposure]
format = "r32f"
scale = 0.0
history = true

[[pass]]
name = "exposure_measure"
type = "fullscreen"
shader = "shaders/post/exposure_measure.fsh"
# Gated on the pass only (target above is ungated — the pass is what costs). Off, the target stays
# cleared to 0.0; tonemap treats "off" via its own #ifdef, never by reading that cleared value.
enabled_if = "AUTO_EXPOSURE"
inputs = ["sceneHdrRefracted", "exposure.history"]
outputs = ["exposure"]

# Strictly sequential — each level blurs the one above, accumulating all prior levels to widen the
# blur without striding a full-res image sparsely (see bloom_blur.fsh).
[[pass]]
name = "bloom_down_4"
type = "fullscreen"
shader = "shaders/post/bloom_blur.fsh"
enabled_if = "BLOOM_ENABLED"
inputs = ["sceneHdrRefracted"]
outputs = ["bloomDown4"]

[[pass]]
name = "bloom_down_8"
type = "fullscreen"
shader = "shaders/post/bloom_blur.fsh"
enabled_if = "BLOOM_ENABLED"
inputs = ["bloomDown4"]
outputs = ["bloomDown8"]

[[pass]]
name = "bloom_down_16"
type = "fullscreen"
shader = "shaders/post/bloom_blur.fsh"
enabled_if = "BLOOM_ENABLED"
inputs = ["bloomDown8"]
outputs = ["bloomDown16"]

[[pass]]
name = "bloom_down_32"
type = "fullscreen"
shader = "shaders/post/bloom_blur.fsh"
enabled_if = "BLOOM_ENABLED"
inputs = ["bloomDown16"]
outputs = ["bloomDown32"]

[[pass]]
name = "bloom_down_64"
type = "fullscreen"
shader = "shaders/post/bloom_blur.fsh"
enabled_if = "BLOOM_ENABLED"
inputs = ["bloomDown32"]
outputs = ["bloomDown64"]

[[pass]]
name = "bloom_down_128"
type = "fullscreen"
shader = "shaders/post/bloom_blur.fsh"
enabled_if = "BLOOM_ENABLED"
inputs = ["bloomDown64"]
outputs = ["bloomDown128"]

[[pass]]
name = "bloom_down_256"
type = "fullscreen"
shader = "shaders/post/bloom_blur.fsh"
enabled_if = "BLOOM_ENABLED"
inputs = ["bloomDown128"]
outputs = ["bloomDown256"]

# Kept as its own pass so tonemap takes one input instead of seven, and so the level weighting is
# stated in one place rather than spread across the composite.
[[pass]]
name = "bloom_combine"
type = "fullscreen"
shader = "shaders/post/bloom_combine.fsh"
enabled_if = "BLOOM_ENABLED"
inputs = ["bloomDown4", "bloomDown8", "bloomDown16", "bloomDown32", "bloomDown64", "bloomDown128", "bloomDown256"]
outputs = ["bloomFinal"]

# Linear HDR -> displayable sRGB. Kept separate from the resolve so bloom, exposure metering and this
# pass all read true scene values.
[[pass]]
name = "tonemap"
type = "fullscreen"
shader = "shaders/post/tonemap.fsh"
# Reads the finished two-pass blur (underwaterBlurred) rather than computing a disc kernel inline.
# Inputs are positional — append only, never insert.
inputs = ["sceneHdrRefracted", "builtin.depth", "bloomFinal", "builtin.waterDepth", "exposure",
          "underwaterBlurred", "builtin.noise", "waterVolumeShaftsResolved", "builtin.gAo",
          "heatBlurred"]
outputs = ["builtin.output"]

# NO SNOW ACCUMULATION / COMPUTE PASS, deliberately: a deferred blend can only paint colour, not
# displace geometry (a geometry pass can't read a pack buffer), so a thin-snow material blend has a
# hard ceiling a snow LAYER block doesn't. Replaced by a static per-fragment dusting in the geometry
# stage instead (shaders/include/snow.glsl, `PLAGUE_SNOW_*` in terrain.fsh) — adds no pass/target/
# input here.
#
# If a field is ever rebuilt: (1) address it TOROIDALLY, `slot = (wz & 127)*128 + (wx & 127)`, so a
# world column owns one slot with no resample step; (2) the write pass must run LAST — Fornax adds no
# compute→fullscreen dependency for a pack pass, so ordering it last is what makes the same-frame
# read deliberately one-frame-old rather than a race.

# Shared geometry buffers for water reflection recovery and the separate coverage overlay.
[targets.voxelOccupancy]
kind = "buffer"
enabled_if = "PLAGUE_VOXEL_COVERAGE != 0 || PLAGUE_VOXEL_REFLECTIONS != 0 || PLAGUE_LOCAL_LIGHTING != 0"

[targets.voxelPayload]
kind = "buffer"
enabled_if = "PLAGUE_VOXEL_COVERAGE != 0 || PLAGUE_VOXEL_REFLECTIONS != 0 || PLAGUE_LOCAL_LIGHTING != 0"

[targets.voxelPalette]
kind = "buffer"
enabled_if = "PLAGUE_VOXEL_COVERAGE != 0 || PLAGUE_VOXEL_REFLECTIONS != 0 || PLAGUE_LOCAL_LIGHTING != 0 || PLAGUE_GI != 0"

# Optional baked face UV and tint buffer for water reflection recovery.

[targets.voxelFaceTexture]
kind = "buffer"
enabled_if = "PLAGUE_VOXEL_REFLECTIONS != 0 || PLAGUE_LOCAL_LIGHTING != 0 || PLAGUE_GI != 0"

[targets.voxelBrickSummary]
kind = "buffer"
enabled_if = "PLAGUE_VOXEL_COVERAGE != 0 || PLAGUE_VOXEL_REFLECTIONS != 0 || PLAGUE_LOCAL_LIGHTING != 0"

[targets.voxelCoverage]
format = "rgba8"
scale = 0.25
filter = "linear"
enabled_if = "PLAGUE_VOXEL_COVERAGE != 0"

[[pass]]
name = "voxel_coverage"
type = "fullscreen"
shader = "shaders/post/voxel_coverage.fsh"
enabled_if = "PLAGUE_VOXEL_COVERAGE != 0"
inputs = ["builtin.waterNormal", "builtin.waterDepth", "builtin.depth",
          "voxelOccupancy", "voxelPayload", "voxelPalette", "voxelBrickSummary"]
outputs = ["voxelCoverage"]

[[pass]]
name = "voxel_coverage_overlay"
type = "fullscreen"
shader = "shaders/post/voxel_coverage_overlay.fsh"
enabled_if = "PLAGUE_VOXEL_COVERAGE != 0"
blend = "translucent"
inputs = ["voxelCoverage"]
outputs = ["builtin.output"]

# These buffers hold debug data only, not light. Turning this on runs voxel harvesting
# even when water and reflections are off.
[targets.voxelSectionState]
kind = "buffer"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC != 0 || PLAGUE_LOCAL_LIGHTING != 0 || PLAGUE_GI != 0"

[targets.voxelSourceSummary]
kind = "buffer"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC != 0 || PLAGUE_GI != 0"

# 256x256 covers the largest window: 33^3 = 35937 sections. Compute writes this image;
# the existing semaphore chain hands it to graphics and waits for readers before the next write.
[targets.voxelSourceStatus]
format = "rgba16f"
width = 256
height = 256
storage = true
filter = "nearest"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC != 0 || PLAGUE_GI != 0"

[[pass]]
name = "voxel_source_status"
type = "compute"
shader = "shaders/compute/voxel_source_status.comp"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC != 0 || PLAGUE_GI != 0"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "voxelSectionState", "voxelSourceSummary"]
outputs = ["voxelSourceStatus"]

[[pass]]
name = "gi_debug_view"
type = "fullscreen"
shader = "shaders/post/gi_debug_view.fsh"
enabled_if = "PLAGUE_GI != 0 && PLAGUE_GI_VIEW != 0"
blend = "translucent"
inputs = ["giBounce", "builtin.gAlbedo", "builtin.depth"]
outputs = ["builtin.output"]

[[pass]]
name = "voxel_source_diagnostic"
type = "fullscreen"
shader = "shaders/post/voxel_source_diagnostic.fsh"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC != 0"
blend = "translucent"
inputs = ["builtin.depth", "voxelSourceStatus"]
outputs = ["builtin.output"]

[[pass]]
name = "clouds_history_overlay_quarter"
type = "fullscreen"
shader = "shaders/post/clouds_history_overlay.fsh"
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 0 && PLAGUE_CLOUD_HISTORY_DEBUG != 0"
blend = "translucent"
inputs = ["cloudHistoryProbeQuarter"]
outputs = ["builtin.output"]

[[pass]]
name = "clouds_history_overlay"
type = "fullscreen"
shader = "shaders/post/clouds_history_overlay.fsh"
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 1 && PLAGUE_CLOUD_HISTORY_DEBUG != 0"
blend = "translucent"
inputs = ["cloudHistoryProbe"]
outputs = ["builtin.output"]

[[pass]]
name = "clouds_history_overlay_full"
type = "fullscreen"
shader = "shaders/post/clouds_history_overlay.fsh"
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 2 && PLAGUE_CLOUD_HISTORY_DEBUG != 0"
blend = "translucent"
inputs = ["cloudHistoryProbeFull"]
outputs = ["builtin.output"]

[[pass]]
name = "clouds_history_overlay_ultra"
type = "fullscreen"
shader = "shaders/post/clouds_history_overlay.fsh"
enabled_if = "CLOUDS_VOLUMETRIC && CLOUD_RESOLUTION == 3 && PLAGUE_CLOUD_HISTORY_DEBUG != 0"
blend = "translucent"
inputs = ["cloudHistoryProbeUltra"]
outputs = ["builtin.output"]

# Terrain's source preview reuses the consolidated G-buffer RGB lanes only while enabled. Normal
# intermediate lighting is invalid in that mode, so this opaque pass runs after every other overlay
# and replaces the final image. No voxel data or extra target is needed; later forward draws remain
# outside the deferred preview.
[[pass]]
name = "source_radiance_preview"
type = "fullscreen"
shader = "shaders/post/source_radiance_preview.fsh"
enabled_if = "PLAGUE_SOURCE_RADIANCE != 0"
inputs = ["consolidatedGbuf", "builtin.depth"]
outputs = ["builtin.output"]

# Bounded candidate thumbnails, not a light list. Compute is the only raw-buffer consumer.
[targets.voxelEmitterPool]
kind = "buffer"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC == 3 || PLAGUE_GI != 0"

[targets.voxelSourceFaces]
format = "rgba16f"
width = 256
height = 256
storage = true
filter = "nearest"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC == 3 || PLAGUE_GI != 0"

[[pass]]
name = "voxel_source_faces"
type = "compute"
shader = "shaders/compute/voxel_source_faces.comp"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC == 3 || PLAGUE_GI != 0"
local_size = [16, 16]
dispatch = [1, 1, 1]
inputs = ["globals", "packOptions", "voxelEmitterPool", "voxelSectionState", "voxelSourceSummary",
          "builtin.blockAtlas", "builtin.materialAtlas", "builtin.blockAtlasPages", "builtin.materialAtlasPages"]
outputs = ["voxelSourceFaces"]

[[pass]]
name = "voxel_source_faces_overlay"
type = "fullscreen"
shader = "shaders/post/voxel_source_faces.fsh"
enabled_if = "PLAGUE_SOURCE_DIAGNOSTIC == 3"
blend = "translucent"
inputs = ["voxelSourceFaces"]
outputs = ["builtin.output"]

# Restores depth for vanilla translucents and first-person rendering, which draw after the graph.
[[pass]]
name = "depth_copyback"
type = "copy"
inputs = ["builtin.depth"]
outputs = ["builtin.sceneDepth"]
